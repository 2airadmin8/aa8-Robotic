<script src="/assets/js/site.js?v=20260716-11" defer></script>
<script>
  (function () {
    // Only a successful form response supplies both status and inquiry_id.
    // A direct visit, or a missing ID, is not proof of an accepted inquiry.
    var params = new URLSearchParams(location.search);
    var inquiryId = (params.get('inquiry_id') || '').trim();
    var freshReceipt = params.get('status') === 'success' && !!inquiryId;
    var receiptCacheKey = 'airadmin8-confirmed-inquiry-receipt-v1';
    // Preserve the confirmed-screen experience after a same-tab refresh,
    // without sending generate_lead a second time.
    if (freshReceipt) {
      try {
        sessionStorage.setItem(receiptCacheKey, JSON.stringify({ id: inquiryId, at: Date.now() }));
      } catch (error) { /* Storage disabled: current receipt still displays. */ }
    } else {
      inquiryId = '';
      try {
        var previous = JSON.parse(sessionStorage.getItem(receiptCacheKey) || 'null');
        if (previous && previous.id && Date.now() - previous.at < 30 * 60 * 1000) {
          inquiryId = String(previous.id);
        } else {
          sessionStorage.removeItem(receiptCacheKey);
        }
      } catch (error) { /* No valid stored receipt. */ }
    }
    if (!inquiryId) return;

    document.title = 'お問い合わせありがとうございます｜AirAdmin8 Robotics';
    document.querySelector('[data-contact-receipt-eyebrow]').textContent = 'INQUIRY RECEIVED';
    document.querySelector('[data-contact-receipt-heading]').textContent = 'お問い合わせを受け付けました。';
    document.querySelector('[data-contact-receipt-detail]').textContent = '内容を確認のうえ、担当よりご連絡します。';
    var link = document.querySelector('[data-contact-receipt-link]');
    link.href = '/';
    link.textContent = 'AirAdmin8 Robotics トップへ戻る';

    if (freshReceipt && typeof window.gtag === 'function') {
      window.gtag('event', 'generate_lead', {
        form_name: 'robotics_contact',
        inquiry_id: inquiryId
      });
    }
    if (freshReceipt && history.replaceState) {
      history.replaceState(null, '', '/contact-thanks.html');
    }
  })();
</script>
