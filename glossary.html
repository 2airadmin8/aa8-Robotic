<script>
const TERMS=[
['ロボット種別','ヒューマノイドロボット','Humanoid Robot','人に近い身体構造を持ち、人向けの空間や道具で作業することを目指すロボット。'],['ロボット種別','四足ロボット','Quadruped Robot','4本脚で移動し、段差や不整地での巡検・計測・研究に使われるロボット。'],['ロボット種別','ロボットアーム','Robot Arm','複数の関節を制御し、把持、組立、計測、実験操作などを行う機構。'],['ロボット種別','協働ロボット','Collaborative Robot','人と同じ作業空間での利用を想定し、安全機能や操作性を重視したロボット。'],['ロボット種別','AMR','Autonomous Mobile Robot','地図やセンサーを使い、固定レールなしで自律移動する搬送ロボット。'],['ロボット種別','AGV','Automated Guided Vehicle','磁気テープやマーカーなど、定めた経路に沿って移動する搬送車。'],['ロボット種別','サービスロボット','Service Robot','製造以外の分野で、人や設備を支援する目的で使われるロボット。'],['ロボット種別','双腕ロボット','Dual-Arm Robot','2本の腕を協調制御し、両手作業や大型物体の操作を行うロボット。'],['ロボット種別','移動マニピュレータ','Mobile Manipulator','移動台車とロボットアームを組み合わせ、移動と操作を連続して行うロボット。'],['ロボット種別','エンドエフェクタ','End Effector','アーム先端に取り付けるハンド、吸着機、工具などの作業装置。'],
['AI・方策','フィジカルAI','Physical AI','現実世界の身体、センサー、環境との相互作用を前提に学習・推論するAIの考え方。'],['AI・方策','具身AI','Embodied AI','身体を持つエージェントが環境との相互作用を通じて知覚・推論・行動を統合するAI。'],['AI・方策','VLA','Vision-Language-Action','画像、言語指示、ロボット行動を一つのモデルで結び付けるアプローチ。'],['AI・方策','VLM','Vision-Language Model','画像と文章を同時に理解し、説明、質問応答、認識支援を行うモデル。'],['AI・方策','世界モデル','World Model','環境状態と行動結果の変化を内部表現として学び、予測や計画に利用するモデル。'],['AI・方策','ロボット基盤モデル','Robot Foundation Model','多様なロボット、タスク、データで学習し、複数用途へ転用することを目指す基盤モデル。'],['AI・方策','汎用ロボットポリシー','Generalist Robot Policy','複数の環境やタスクに対して行動を生成できる汎用的なロボット方策。'],['AI・方策','Diffusion Policy','Diffusion Policy','拡散モデルを用いて、観測から滑らかな行動系列を生成するロボット制御手法。'],['AI・方策','ACT','Action Chunking with Transformers','複数ステップの行動をまとまりとして予測し、長時間タスクの安定化を図る手法。'],['AI・方策','ポリシー','Policy','観測された状態に対して、次に実行する行動を決める規則または学習モデル。'],
['学習・データ','模倣学習','Imitation Learning','人や既存方策の実演データから、ロボットの行動を学習する方法。'],['学習・データ','強化学習','Reinforcement Learning','行動結果の報酬を手掛かりに、望ましい方策を試行錯誤で学ぶ手法。'],['学習・データ','自己教師あり学習','Self-Supervised Learning','データ自身から学習課題を作り、大量の未ラベルデータを活用する方法。'],['学習・データ','ファインチューニング','Fine-Tuning','既存モデルを特定タスクや保有データに合わせて追加学習すること。'],['学習・データ','データ収集','Data Collection','学習、評価、再現性確認のために画像、センサー値、操作、結果を記録する工程。'],['学習・データ','ロボットデータセット','Robot Dataset','画像、言語指示、関節状態、動作軌跡、力覚などを学習・評価用に整理したデータ集合。'],['学習・データ','マルチモーダルデータ','Multimodal Robot Data','RGB、Depth、音声、力覚、触覚、関節角度、言語指示などを組み合わせたデータ。'],['学習・データ','Cross-Embodiment','Cross-Embodiment Learning','異なる機体や身体構造で集めたデータを共有し、汎化性能を高める学習の考え方。'],['学習・データ','合成データ','Synthetic Data','シミュレーションや生成モデルで作り、実データを補完する学習・評価用データ。'],['学習・データ','Domain Randomization','Domain Randomization','仮想環境の見た目や物理条件を変化させ、実環境への適応力を高める手法。'],
['制御・動作','モーションプランニング','Motion Planning','障害物や関節制約を考慮し、目的姿勢までの安全な動作経路を計算する技術。'],['制御・動作','タスクプランニング','Task Planning','目的をサブタスクへ分解し、実行順序や失敗時の再計画を組み立てる技術。'],['制御・動作','全身制御','Whole-Body Control','重心、接触、複数関節を同時に扱い、全身のバランスと作業動作を統合する制御。'],['制御・動作','逆運動学','Inverse Kinematics','手先などの目標位置から、必要な各関節角度を求める計算。'],['制御・動作','順運動学','Forward Kinematics','関節角度から手先や各部位の位置・姿勢を求める計算。'],['制御・動作','インピーダンス制御','Impedance Control','接触時の力と位置の関係を調整し、柔らかく安全な動作を実現する制御。'],['制御・動作','リアルタイム制御','Real-Time Control','決められた時間内に処理を完了し、遅延を抑えて動作を制御する考え方。'],['制御・動作','制御周期','Control Frequency','センサー取得と制御指令を1秒間に何回更新するかを示す周期・周波数。'],['制御・動作','レイテンシ','Latency','入力、推論、通信、制御指令が反映されるまでに生じる遅延時間。'],['制御・動作','Action Space','Action Space','学習モデルや制御器が出力できる行動の種類、範囲、表現方法。'],
['認識・センサー','SLAM','Simultaneous Localization and Mapping','自己位置推定と周辺地図作成を同時に行う技術。'],['認識・センサー','自己位置推定','Localization','センサーや地図を使い、ロボットが現在位置と向きを推定する処理。'],['認識・センサー','物体認識','Object Recognition','カメラ等から対象物の種類、位置、姿勢を推定する技術。'],['認識・センサー','3Dシーン再構成','3D Scene Reconstruction','カメラや距離センサーから周囲の三次元形状と配置を復元する技術。'],['認識・センサー','センサーフュージョン','Sensor Fusion','複数センサーの長所を組み合わせ、認識や推定の安定性を高める処理。'],['認識・センサー','LiDAR','Light Detection and Ranging','レーザー光の反射時間から周囲までの距離を測るセンサー。'],['認識・センサー','RGB-Dカメラ','RGB-D Camera','カラー画像と奥行き情報を同時に取得し、点群、認識、SLAM、把持位置推定に使うカメラ。'],['認識・センサー','IMU','Inertial Measurement Unit','加速度と角速度を測り、姿勢や運動状態の推定に使うセンサー。'],['認識・センサー','力覚センサー','Force/Torque Sensor','接触時の力やトルクを測り、組立、把持、安全制御に使うセンサー。'],['認識・センサー','触覚センサー','Tactile Sensor','接触位置、圧力、滑りなどを検知し、繊細な把持に使うセンサー。'],
['開発基盤','ROS 2','Robot Operating System 2','分散通信、品質設定、セキュリティなどを強化した現行世代のROS。'],['開発基盤','ROS 2 QoS','Quality of Service','通信の信頼性、履歴、耐久性などを用途ごとに設定するROS 2の仕組み。'],['開発基盤','DDS / RMW','Data Distribution Service / ROS Middleware','ROS 2のノード間通信を支える通信規格と実装層。'],['開発基盤','Topic','ROS 2 Topic','センサーデータなどを継続的に配信・購読するROS 2の通信方式。'],['開発基盤','Service / Action','ROS 2 Service / Action','要求応答型の処理と、進捗・キャンセルを伴う長時間処理の通信方式。'],['開発基盤','TF2','Transform Library','ロボット各部やセンサー間の座標系と時間変化を管理するROS 2ライブラリ。'],['開発基盤','URDF','Unified Robot Description Format','リンク、関節、形状、慣性などロボット構造を記述するXML形式。'],['開発基盤','MJCF','MuJoCo XML Format','MuJoCoでロボット機構、物理特性、センサーなどを記述するモデル形式。'],['開発基盤','SDK','Software Development Kit','ロボット機能を利用・拡張するためのライブラリ、仕様書、サンプル群。'],['開発基盤','API','Application Programming Interface','外部ソフトウェアから機能やデータを呼び出すための接続仕様。'],
['仮想検証','シミュレーション','Simulation','実機を動かす前に、仮想環境で動作、学習、安全性を検証する方法。'],['仮想検証','Sim-to-Real','Simulation to Reality','シミュレーションで学習・検証した内容を実機へ移す考え方と技術。'],['仮想検証','Zero-shot Sim-to-Real','Zero-shot Simulation to Reality','実機での追加学習を前提とせず、仮想環境で得た方策を実機へ直接適用する考え方。'],['仮想検証','デジタルツイン','Digital Twin','実設備やロボットの状態を仮想空間に対応付け、分析や予測に使う仕組み。'],['仮想検証','Isaac Sim','NVIDIA Isaac Sim','NVIDIA Omniverse上でロボットシミュレーションや合成データ生成を行う環境。'],['仮想検証','Isaac Lab','NVIDIA Isaac Lab','Isaac Sim上で強化学習、模倣学習、ロボット学習の実験を構成するフレームワーク。'],['仮想検証','MuJoCo','Multi-Joint dynamics with Contact','接触を含むロボット力学の研究や強化学習で使われる物理シミュレータ。'],['仮想検証','Gazebo','Gazebo Simulator','ROS連携を含むロボットシミュレーションで広く使われる環境。'],['仮想検証','Hardware-in-the-Loop','HIL','実機の一部とシミュレーションを接続し、制御や通信を検証する方法。'],['仮想検証','System Identification','System Identification','実機応答から質量、摩擦、遅延などのモデルパラメータを推定する手法。'],
['導入・安全','PoC','Proof of Concept','限定した範囲で技術成立性、効果、運用条件を確認する検証。'],['導入・安全','KPI','Key Performance Indicator','PoCや導入の成否を判断するために事前に定める評価指標。'],['導入・安全','技適','Technical Regulations Conformity Certification','日本で無線機能を使用する際に確認が必要になる電波法上の適合表示。'],['導入・安全','UN38.3','UN Manual of Tests and Criteria 38.3','リチウム電池の国際輸送で確認される安全試験要件。'],['導入・安全','E-stop','Emergency Stop','異常時にロボットの動力や動作を速やかに停止する非常停止機能。'],['導入・安全','安全領域','Safety Zone','人や設備との距離に応じて減速・停止させるために設定する監視領域。'],['導入・安全','フェイルセーフ','Fail-Safe','故障や異常が起きた際に危険側ではなく安全側へ移行させる設計原則。'],['導入・安全','可搬重量','Payload','ロボットが仕様上保持・搬送できる対象物の最大重量。'],['導入・安全','自由度','Degrees of Freedom','ロボットが独立して動かせる軸や方向の数。'],['導入・安全','保守・サポート','Maintenance and Support','故障対応、部品供給、更新、問い合わせ窓口など導入後の運用支援。']
];
const categories=[...new Set(TERMS.map(t=>t[0]))];const content=document.querySelector('#glossary-content');const buttons=document.querySelector('#category-buttons');
function render(q=''){content.innerHTML='';let total=0;for(const category of categories){const rows=TERMS.filter(t=>t[0]===category&&(!q||t.join(' ').toLowerCase().includes(q)));if(!rows.length)continue;total+=rows.length;const section=document.createElement('section');section.className='glossary-category';section.id='cat-'+(categories.indexOf(category)+1);section.innerHTML='<h2>'+category+'</h2><div class="term-grid">'+rows.map(t=>'<article class="term-card"><h3>'+t[1]+'</h3><p class="term-en">'+t[2]+'</p><p>'+t[3]+'</p></article>').join('')+'</div>';content.appendChild(section)}document.querySelector('#no-results').style.display=total?'none':'block'}
for(const category of categories){const b=document.createElement('button');b.type='button';b.textContent=category;b.onclick=()=>{document.querySelector('#glossary-search').value=category;render(category.toLowerCase())};buttons.appendChild(b)}document.querySelector('#glossary-search').addEventListener('input',e=>render(e.target.value.trim().toLowerCase()));render();
</script>
