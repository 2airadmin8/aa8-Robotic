name: One-time source migration

on:
  push:
    branches: [cleanup/repository-v1]
    paths:
      - .github/workflows/source-migration-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/repository-v1
          fetch-depth: 0

      - name: Migrate all source pages to v1 layout
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          header = (root / 'includes/site-header.html').read_text(encoding='utf-8').strip()
          footer = (root / 'includes/site-footer.html').read_text(encoding='utf-8').strip()

          header_re = re.compile(r'<header\b(?=[^>]*class=["\'][^"\']*\bsite-header\b[^"\']*["\'])[^>]*>.*?</header>', re.I | re.S)
          footer_re = re.compile(r'<footer\b(?=[^>]*class=["\'][^"\']*\bfooter\b[^"\']*["\'])[^>]*>.*?</footer>', re.I | re.S)

          changed = []
          failures = []
          for path in sorted(root.rglob('*.html')):
              if any(part in {'.git', '.github', '_site', 'includes'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated, hc = header_re.subn(header, text, count=1)
              updated, fc = footer_re.subn(footer, updated, count=1)
              updated = updated.replace('https://robotics.air-admin8.co.jp/aa8-Robotic/', 'https://robotics.air-admin8.co.jp/')
              if hc != 1 or fc != 1:
                  failures.append(f'{path}: header={hc}, footer={fc}')
                  continue
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed.append(path.as_posix())

          for path in sorted(root.rglob('*')):
              if not path.is_file() or any(part in {'.git', '_site'} for part in path.parts):
                  continue
              if path.suffix.lower() not in {'.xml', '.json', '.js', '.css', '.md', '.txt'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = text.replace('https://robotics.air-admin8.co.jp/aa8-Robotic/', 'https://robotics.air-admin8.co.jp/')
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed.append(path.as_posix())

          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'Migrated {len(set(changed))} source file(s).')
          for item in sorted(set(changed)):
              print(item)

      - name: Validate source migration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -Fq 'class="brand-picture"' . --include='*.html' --exclude-dir=.git --exclude-dir=_site --exclude-dir=includes
          ! grep -R -Fq 'https://robotics.air-admin8.co.jp/aa8-Robotic/' . --include='*.html' --include='*.xml' --include='*.json' --include='*.js' --include='*.css' --exclude-dir=.git --exclude-dir=_site

      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '*.xml' '*.json' '*.js' '*.css' '*.md' '*.txt' '**/*.html' '**/*.xml' '**/*.json' '**/*.js' '**/*.css' '**/*.md' '**/*.txt' || true
          if git diff --cached --quiet; then
            echo 'Source already migrated.'
            exit 0
          fi
          git commit -m 'refactor: migrate all source pages to v1 shared layout'
          git push origin HEAD:cleanup/repository-v1
