name: Auto Forward

on:
  workflow_run:
    workflows:
      - PR CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-forward-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  handle-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge on success or stop on failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];

            if (prs.length === 0) {
              core.setFailed(`No pull request is associated with workflow run ${run.id}.`);
              return;
            }

            for (const item of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: item.number,
              });

              if (pr.state !== 'open') {
                core.info(`PR #${pr.number} is already ${pr.state}; skipping.`);
                continue;
              }

              if (pr.draft || pr.base.ref !== 'main') {
                core.info(`PR #${pr.number} is draft or does not target main; skipping.`);
                continue;
              }

              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed(`PR #${pr.number} comes from a fork; automatic merge is blocked.`);
                continue;
              }

              if (pr.head.sha !== run.head_sha) {
                core.setFailed(`PR #${pr.number} head moved after CI. Expected ${run.head_sha}, current ${pr.head.sha}.`);
                continue;
              }

              if (run.conclusion !== 'success') {
                const marker = '<!-- aa8-auto-forward-ci-failed -->';
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                });

                if (!comments.some(comment => comment.body?.includes(marker))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `${marker}\n⛔ PR CIが **${run.conclusion}** のため、自動マージを停止しました。失敗箇所を修正して再実行してください。`,
                  });
                }

                core.info(`PR #${pr.number} was not merged because CI concluded ${run.conclusion}.`);
                continue;
              }

              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: pr.head.sha,
                commit_title: `${pr.title} (#${pr.number})`,
                commit_message: 'PR CI成功後にAuto Forwardで自動マージ。',
              });

              if (!result.data.merged) {
                core.setFailed(`Automatic merge failed for PR #${pr.number}: ${result.data.message}`);
                continue;
              }

              core.info(`PR #${pr.number} merged successfully at ${result.data.sha}.`);
            }
