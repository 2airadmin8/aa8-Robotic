name: TOP Header Sync

on:
  push:
    branches: [main]
    paths:
      - 'includes/site-header.html'
      - 'index.html'
      - 'scripts/sync_top_header.py'
      - '.github/workflows/top-header-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top-header-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync TOP header from single source
        run: |
          set -euo pipefail
          python scripts/sync_top_header.py
          grep -Fq 'brand-logo-pc' index.html
          grep -Fq 'brand-logo-sp' index.html
          ! grep -Fq '<picture class="brand-picture">' index.html

      - name: Commit synchronized TOP header
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'TOP header already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'BUILD: TOPヘッダーを共通Headerへ同期 [skip top-header-sync]'
          git push origin HEAD:main
