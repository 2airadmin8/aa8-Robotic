name: CI Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ci-watchdog
  cancel-in-progress: true

jobs:
  detect-missing-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const graceMs = 10 * 60 * 1000;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const missing = [];

            for (const pr of pulls) {
              if (pr.draft || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                continue;
              }

              const updatedAt = new Date(pr.updated_at).getTime();
              if (now - updatedAt < graceMs) {
                continue;
              }

              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'pull_request',
                head_sha: pr.head.sha,
                per_page: 100,
              });

              const ciRuns = runs.filter(run => run.name === 'PR CI');
              if (ciRuns.length > 0) {
                continue;
              }

              const marker = `<!-- aa8-ci-not-triggered:${pr.head.sha} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              if (!comments.some(comment => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `${marker}\n⚠️ PR作成・更新から10分以上経過しましたが、PR CIが起動していません。PRを再オープンするか、新しいCommitをpushし、Workflow設定を確認してください。`,
                });
              }

              missing.push(`#${pr.number} (${pr.head.sha.slice(0, 8)})`);
            }

            if (missing.length > 0) {
              core.setFailed(`PR CI未起動: ${missing.join(', ')}`);
            } else {
              core.info('All eligible open PRs have PR CI evidence.');
            }
