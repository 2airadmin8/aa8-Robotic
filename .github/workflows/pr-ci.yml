name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          validators=(
            scripts/validate_catalog.py
            scripts/validate_seo.py
            scripts/validate_analytics.py
            scripts/validate_cases.py
            scripts/validate_search_index.py
          )

          for validator in "${validators[@]}"; do
            if [[ -f "${validator}" ]]; then
              echo "Running ${validator}"
              python -m py_compile "${validator}"
              python "${validator}"
            fi
          done

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python -m py_compile scripts/build_site.py
          python scripts/build_site.py
          test -s _site/index.html

      - name: Apply production enhancements
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/prerender_product_cards.py
            scripts/prerender_resources.py
            scripts/inject_accessibility.py
            scripts/inject_static_meta.py
            scripts/inject_structured_data.py
            scripts/prepare_compare_print_assets.py
            scripts/inject_main_site_experience.py
          )

          for script in "${scripts[@]}"; do
            if [[ -f "${script}" ]]; then
              echo "Running ${script}"
              python -m py_compile "${script}"
              python "${script}"
            fi
          done

      - name: Smoke-test built site
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/validate_built_site.py ]]; then
            python -m py_compile scripts/validate_built_site.py
            python scripts/validate_built_site.py
          fi

          required_files=(
            _site/index.html
            _site/products.html
            _site/contact.html
            _site/CNAME
          )

          for file in "${required_files[@]}"; do
            test -s "${file}" || { echo "Missing required file: ${file}"; exit 1; }
          done

          grep -Fxq 'robotics.air-admin8.co.jp' _site/CNAME
