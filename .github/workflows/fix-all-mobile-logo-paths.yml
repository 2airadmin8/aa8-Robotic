name: Fix all mobile logo paths

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-all-mobile-logo-paths.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize logo markup and paths on all HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260802-logo-path-final'
          picture = (
              '<picture class="brand-picture">'
              f'<source media="(max-width: 640px)" srcset="/assets/img/logo-airadmin8-robotics-sp.svg?v={version}">'
              f'<img src="/assets/img/logo-airadmin8-robotics-pc.svg?v={version}" '
              'alt="AirAdmin8 Robotics" width="180" height="42">'
              '</picture>'
          )

          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')

              # Replace any existing brand contents, regardless of old markup.
              pattern = re.compile(r'(<a\b[^>]*class="[^"]*\bbrand\b[^"]*"[^>]*>).*?(</a>)', re.S)
              new_text, count = pattern.subn(lambda m: m.group(1) + picture + m.group(2), text, count=1)

              # Force the newest cache key for the header patch stylesheet.
              new_text = re.sub(
                  r'review-fixes-20260731\.css\?v=[^"\']+',
                  f'review-fixes-20260731.css?v={version}',
                  new_text,
              )

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')

          css_path = Path('assets/css/review-fixes-20260731.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* logo-path-final */'
          block = '''

/* logo-path-final */
.site-header .brand {
  background: none !important;
  overflow: visible !important;
}
.site-header .brand > *:not(.brand-picture) {
  display: none !important;
}
.site-header .brand-picture,
.site-header .brand-picture img {
  display: block !important;
}
.site-header .brand-picture {
  width: 100% !important;
  height: 100% !important;
}
.site-header .brand-picture img {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  object-position: left center !important;
}
@media (max-width: 980px) {
  .site-header .header-inner {
    min-height: 60px !important;
  }
  .site-header .brand {
    width: 135px !important;
    height: 35px !important;
    flex: 0 0 135px !important;
  }
  .site-header .nav {
    top: 60px !important;
  }
}
'''
          if marker not in css:
              css_path.write_text(css + block, encoding='utf-8')
          PY

      - name: Commit fixed paths
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: show uploaded SP logo on every mobile page"
          git pull --rebase origin main
          git push origin main
