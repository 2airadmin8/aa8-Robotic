name: Finalize Unitree G1-D page and media

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-g1d-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize media, page and product data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('assets/img/products/unitree/unitree-g1-d')
          root.mkdir(parents=True, exist_ok=True)

          mapping = {
              'G1-D-tp-1-450x450.png': 'unitree-g1-d-main.png',
              'G1-D本体.png': 'unitree-g1-d-body.png',
              'G1-D本体_背景白.png': 'unitree-g1-d-white-bg.png',
              'P03.png': 'unitree-g1-d-structure.png',
              'Unitree-G1-D-01.png': 'unitree-g1-d-gallery-01.png',
              'Unitree-G1-D-02.png': 'unitree-g1-d-gallery-02.png',
              'Unitree-G1-D-03.png': 'unitree-g1-d-gallery-03.png',
              'Unitree-G1-D-04.png': 'unitree-g1-d-gallery-04.png',
              'Unitree-G1-D-05.png': 'unitree-g1-d-gallery-05.png',
              'Unitree-G1-D-06.png': 'unitree-g1-d-gallery-06.png',
              'Unitree-G1-D_製品画像.jpg': 'unitree-g1-d-product.jpg',
              'Unitree-G1-D_01データ収集.png': 'unitree-g1-d-workflow-01-data-collection.png',
              'Unitree-G1-D_02タスク修正.png': 'unitree-g1-d-workflow-02-task-correction.png',
              'Unitree-G1-D_03データ収集.png': 'unitree-g1-d-workflow-03-data-collection.png',
              'Unitree-G1-D_04データUL.png': 'unitree-g1-d-workflow-04-data-upload.png',
              'Unitree-G1-D_05データ保存.png': 'unitree-g1-d-workflow-05-data-save.png',
              'Unitree-G1-D_05データ出力.png': 'unitree-g1-d-workflow-06-data-export.png',
              'サービスロボット_G1-D.jpg': 'unitree-g1-d-use-service.jpg',
              '工場・産業_G1-D.jpg': 'unitree-g1-d-use-factory.jpg',
              '店舗支援_2170x1360.jpg': 'unitree-g1-d-use-retail.jpg',
              '本体02.png': 'unitree-g1-d-body-02.png',
              '本体VR.png': 'unitree-g1-d-vr.png',
              '本体搬運.png': 'unitree-g1-d-transport.png',
              '生活支援ロボット_G1-D.jpg': 'unitree-g1-d-use-life-support.jpg',
          }

          for old_name, new_name in mapping.items():
              old = root / old_name
              new = root / new_name
              if old.exists() and not new.exists():
                  old.rename(new)
              elif old.exists() and new.exists():
                  old.unlink()

          keep = root / '.gitkeep'
          if keep.exists():
              keep.unlink()

          base = '/assets/img/products/unitree/unitree-g1-d/'
          hero = base + 'unitree-g1-d-transport.png'

          media = {
              'schemaVersion': 1,
              'updatedAt': '2026-08-02',
              'products': {
                  'unitree-g1-d': {
                      'manufacturer': 'unitree',
                      'main': hero,
                      'transport': hero,
                      'body': base + 'unitree-g1-d-body.png',
                      'whiteBackground': base + 'unitree-g1-d-white-bg.png',
                      'structure': base + 'unitree-g1-d-structure.png',
                      'gallery': [base + f'unitree-g1-d-gallery-{i:02d}.png' for i in range(1, 7)],
                      'workflow': [
                          base + 'unitree-g1-d-workflow-01-data-collection.png',
                          base + 'unitree-g1-d-workflow-02-task-correction.png',
                          base + 'unitree-g1-d-workflow-03-data-collection.png',
                          base + 'unitree-g1-d-workflow-04-data-upload.png',
                          base + 'unitree-g1-d-workflow-05-data-save.png',
                          base + 'unitree-g1-d-workflow-06-data-export.png',
                      ],
                      'useCases': {
                          'service': base + 'unitree-g1-d-use-service.jpg',
                          'lifeSupport': base + 'unitree-g1-d-use-life-support.jpg',
                          'retail': base + 'unitree-g1-d-use-retail.jpg',
                          'factory': base + 'unitree-g1-d-use-factory.jpg',
                          'vr': base + 'unitree-g1-d-vr.png',
                      },
                  }
              },
          }
          Path('data/product-media.json').write_text(
              json.dumps(media, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          products_path = Path('data/products.json')
          products = json.loads(products_path.read_text(encoding='utf-8'))
          products['updatedAt'] = '2026-08-02'
          for item in products.get('products', []):
              if item.get('id') == 'unitree-g1-d':
                  item['image'] = hero.lstrip('/')
                  item['imageAlt'] = 'Unitree G1-D 移動操作・データ収集プラットフォーム'
                  item['imageStatus'] = 'official'
                  item['mediaSource'] = 'data/product-media.json'
                  item['verifiedAt'] = '2026-08-02'
          products_path.write_text(
              json.dumps(products, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          page = Path('products/unitree-g1-d.html')
          text = page.read_text(encoding='utf-8')

          # Canonical and structured-data URLs use the production root.
          text = text.replace(
              'https://robotics.air-admin8.co.jp/aa8-Robotic/products/unitree-g1-d.html',
              'https://robotics.air-admin8.co.jp/products/unitree-g1-d.html',
          )
          text = text.replace(
              'https://robotics.air-admin8.co.jp/aa8-Robotic/products.html',
              'https://robotics.air-admin8.co.jp/products.html',
          )
          text = text.replace(
              'https://robotics.air-admin8.co.jp/aa8-Robotic/',
              'https://robotics.air-admin8.co.jp/',
          )

          # Directly set the hero image to the normalized local asset.
          text, hero_count = re.subn(
              r'(<figure class="g1d-hero-media"[^>]*>\s*<img\s+src=")[^"]+("[^>]*>)',
              rf'\1{hero}?v=20260802-final\2',
              text,
              count=1,
              flags=re.S,
          )
          if hero_count != 1:
              raise SystemExit('G1-D hero image was not found exactly once')

          # Replace remaining external Unitree images in document order with local assets.
          local_sequence = [
              base + 'unitree-g1-d-use-service.jpg',
              base + 'unitree-g1-d-use-life-support.jpg',
              base + 'unitree-g1-d-use-retail.jpg',
              base + 'unitree-g1-d-use-factory.jpg',
              base + 'unitree-g1-d-structure.png',
              base + 'unitree-g1-d-workflow-01-data-collection.png',
              base + 'unitree-g1-d-workflow-02-task-correction.png',
              base + 'unitree-g1-d-workflow-03-data-collection.png',
              base + 'unitree-g1-d-workflow-04-data-upload.png',
              base + 'unitree-g1-d-workflow-05-data-save.png',
              base + 'unitree-g1-d-workflow-06-data-export.png',
          ]
          external_pattern = re.compile(r'https://www\.unitree\.com/images/[^"\']+')
          for local in local_sequence:
              text, count = external_pattern.subn(local, text, count=1)
              if count == 0:
                  break

          # Final hero rules override the old card-style rules without negative margins.
          marker = '/* g1d-hero-final-20260802 */'
          final_css = '''
    /* g1d-hero-final-20260802 */
    .g1d-hero-grid{
      grid-template-columns:minmax(0,1fr) minmax(420px,.92fr);
      gap:32px;
      align-items:center;
    }
    .g1d-hero-grid>div:first-child{
      min-width:0;
      padding-right:0;
    }
    .g1d-hero-media{
      margin:0;
      overflow:visible;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .g1d-hero-media img{
      display:block;
      width:100%;
      height:620px;
      max-width:100%;
      object-fit:contain;
      object-position:center bottom;
      background:transparent;
      border:0;
      border-radius:0;
      box-shadow:none;
      filter:none;
    }
    .g1d-hero-media .g1d-caption{
      padding:8px 0 0;
      text-align:center;
      background:transparent;
    }
    @media(max-width:980px){
      .g1d-hero-grid{grid-template-columns:1fr;gap:24px}
      .g1d-hero-media img{height:min(520px,72vw)}
    }
    @media(max-width:640px){
      .g1d-hero{padding-top:28px}
      .g1d-hero-media img{height:auto;max-height:440px}
    }
'''
          if marker not in text:
              text = text.replace('</style>', final_css + '\n  </style>', 1)

          # Replace any text references to the old uploaded filenames.
          for old_name, new_name in mapping.items():
              text = text.replace(old_name, new_name)

          page.write_text(text, encoding='utf-8')

          # Remove the obsolete one-time workflows from the final repository state.
          for workflow in (
              Path('.github/workflows/normalize-unitree-g1d-media.yml'),
              Path('.github/workflows/fix-g1d-hero.yml'),
          ):
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Validate final state
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/img/products/unitree/unitree-g1-d/unitree-g1-d-transport.png
          test -f data/product-media.json
          python -m json.tool data/product-media.json >/dev/null
          python -m json.tool data/products.json >/dev/null
          grep -q '/assets/img/products/unitree/unitree-g1-d/unitree-g1-d-transport.png' products/unitree-g1-d.html
          grep -q 'g1d-hero-final-20260802' products/unitree-g1-d.html
          ! grep -q '本体搬運.png' products/unitree-g1-d.html
          ! grep -q 'https://www.unitree.com/images/' products/unitree-g1-d.html
          ! test -e .github/workflows/fix-g1d-hero.yml
          ! test -e .github/workflows/normalize-unitree-g1d-media.yml
          ! find assets/img/products/unitree/unitree-g1-d -maxdepth 1 -type f -printf '%f\n' | grep -P '[^\x00-\x7F]'

      - name: Commit final production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize Unitree G1-D page and normalized media"
          git pull --rebase origin main
          git push origin main
