name: Production URL Check

on:
  workflow_run:
    workflows:
      - Build and deploy static site to GitHub Pages
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-url-check
  cancel-in-progress: true

jobs:
  check-production:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://robotics.air-admin8.co.jp
    steps:
      - name: Check production pages, logos and SEO assets
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            local attempts=10

            for attempt in $(seq 1 "${attempts}"); do
              status="$(curl --location --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 2 \
                --retry-delay 2 \
                --header 'Cache-Control: no-cache' \
                --user-agent 'AirAdmin8-Production-Check/5.0' \
                --output "${output}" \
                --write-out '%{http_code}' \
                "${url}?healthcheck=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"

              echo "Attempt ${attempt}/${attempts}: ${url} -> HTTP ${status:-000}"
              if [[ "${status}" == "200" ]] && [[ -s "${output}" ]]; then
                return 0
              fi
              sleep 12
            done
            return 1
          }

          check_page() {
            local path="$1"
            local expected="$2"
            local canonical="$3"
            local body
            body="$(mktemp)"

            echo "::group::${BASE_URL}${path}"
            fetch_with_retry "${BASE_URL}${path}" "${body}" || {
              echo "FAIL: HTTP 200 not confirmed: ${path}"
              rm -f "${body}"
              echo "::endgroup::"
              return 1
            }

            grep -Fqi -- "${expected}" "${body}" || {
              echo "FAIL: required text missing: ${expected}"
              rm -f "${body}"
              echo "::endgroup::"
              return 1
            }

            python - "${body}" "${canonical}" <<'PY' || {
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
          expected = sys.argv[2]
          tags = re.findall(r'<link\b[^>]*>', html, flags=re.I)
          canonical_values = []
          for tag in tags:
              if not re.search(r'\brel\s*=\s*["\']canonical["\']', tag, flags=re.I):
                  continue
              match = re.search(r'\bhref\s*=\s*["\']([^"\']+)["\']', tag, flags=re.I)
              if match:
                  canonical_values.append(match.group(1))
          if expected not in canonical_values:
              print(f'FAIL: canonical mismatch: expected={expected} actual={canonical_values}')
              raise SystemExit(1)
          PY
              rm -f "${body}"
              echo "::endgroup::"
              return 1
            }

            if grep -Fqi -- "There isn't a GitHub Pages site here" "${body}" || grep -Fqi -- "404 File not found" "${body}"; then
              echo "FAIL: GitHub Pages 404 content detected: ${path}"
              rm -f "${body}"
              echo "::endgroup::"
              return 1
            fi

            echo "PASS: ${path}"
            rm -f "${body}"
            echo "::endgroup::"
          }

          failures=0

          check_page "/" "AirAdmin8" "${BASE_URL}/" || failures=$((failures + 1))
          check_page "/products.html" "研究用AIロボット製品一覧" "${BASE_URL}/products.html" || failures=$((failures + 1))
          check_page "/products/unitree-g1.html" "Unitree G1" "${BASE_URL}/products/unitree-g1.html" || failures=$((failures + 1))
          check_page "/products/unitree-g1-d.html" "Unitree G1-D" "${BASE_URL}/products/unitree-g1-d.html" || failures=$((failures + 1))
          check_page "/compare/unitree-g1-vs-g1-d.html" "歩行研究ならG1" "${BASE_URL}/compare/unitree-g1-vs-g1-d.html" || failures=$((failures + 1))
          check_page "/products/agibot-x2-edu.html" "AgiBot X2 EDU" "${BASE_URL}/products/agibot-x2-edu.html" || failures=$((failures + 1))
          check_page "/guides/agibot-price.html" "AgiBot" "${BASE_URL}/guides/agibot-price.html" || failures=$((failures + 1))
          check_page "/resources.html" "SDK" "${BASE_URL}/resources.html" || failures=$((failures + 1))
          check_page "/about.html" "AirAdmin8" "${BASE_URL}/about.html" || failures=$((failures + 1))
          check_page "/contact.html" "製品・導入" "${BASE_URL}/contact.html" || failures=$((failures + 1))

          home="$(mktemp)"
          css="$(mktemp)"
          sp_logo="$(mktemp)"
          pc_logo="$(mktemp)"
          sitemap="$(mktemp)"
          robots="$(mktemp)"
          metadata="$(mktemp)"

          fetch_with_retry "${BASE_URL}/" "${home}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/assets/css/shared-layout.css" "${css}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/assets/img/logo-airadmin8-robotics-sp.svg" "${sp_logo}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/assets/img/logo-airadmin8-robotics-pc.svg" "${pc_logo}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/sitemap.xml" "${sitemap}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/robots.txt" "${robots}" || failures=$((failures + 1))
          fetch_with_retry "${BASE_URL}/deploy-meta.json" "${metadata}" || failures=$((failures + 1))

          grep -Fq 'class="brand-logo brand-logo-sp"' "${home}" || { echo "FAIL: SP logo img missing from production HTML"; failures=$((failures + 1)); }
          grep -Fq 'logo-airadmin8-robotics-sp.svg' "${home}" || { echo "FAIL: SP logo path missing from production HTML"; failures=$((failures + 1)); }
          grep -Fq 'class="brand-logo brand-logo-pc"' "${home}" || { echo "FAIL: PC logo img missing from production HTML"; failures=$((failures + 1)); }
          grep -Fq 'logo-airadmin8-robotics-pc.svg' "${home}" || { echo "FAIL: PC logo path missing from production HTML"; failures=$((failures + 1)); }
          grep -Fq '.brand-logo-sp' "${css}" || { echo "FAIL: SP logo CSS selector missing"; failures=$((failures + 1)); }
          grep -Fq '.brand-logo-pc' "${css}" || { echo "FAIL: PC logo CSS selector missing"; failures=$((failures + 1)); }
          grep -Fq '@media (max-width:980px)' "${css}" || { echo "FAIL: SP breakpoint missing"; failures=$((failures + 1)); }
          grep -Fq '<svg' "${sp_logo}" || { echo "FAIL: SP logo asset is not valid SVG content"; failures=$((failures + 1)); }
          grep -Fq 'viewBox="0 0 135 35"' "${sp_logo}" || { echo "FAIL: SP logo SVG viewBox mismatch"; failures=$((failures + 1)); }
          grep -Fq '<svg' "${pc_logo}" || { echo "FAIL: PC logo asset is not valid SVG content"; failures=$((failures + 1)); }

          grep -Fq "${BASE_URL}/" "${sitemap}" || { echo "FAIL: sitemap base URL missing"; failures=$((failures + 1)); }
          grep -Fq "${BASE_URL}/compare/unitree-g1-vs-g1-d.html" "${sitemap}" || { echo "FAIL: comparison page missing from sitemap"; failures=$((failures + 1)); }
          grep -Fq "Sitemap: ${BASE_URL}/sitemap.xml" "${robots}" || { echo "FAIL: robots sitemap declaration missing"; failures=$((failures + 1)); }

          python - "${metadata}" <<'PY' || failures=$((failures + 1))
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          sha = data.get('commit_sha', '')
          if len(sha) != 40:
              raise SystemExit('FAIL: deploy-meta.json commit_sha is invalid')
          print(f'Production SHA: {sha}')
          PY

          rm -f "${home}" "${css}" "${sp_logo}" "${pc_logo}" "${sitemap}" "${robots}" "${metadata}"

          if [[ "${failures}" -ne 0 ]]; then
            echo "${failures} production check(s) failed."
            exit 1
          fi

          echo "All production URL, canonical, logo and SEO checks passed."
