name: Production URL Check

on:
  workflow_run:
    workflows:
      - Build and deploy static site to GitHub Pages
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-url-check
  cancel-in-progress: true

jobs:
  check-production:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://robotics.air-admin8.co.jp
    steps:
      - name: Check production pages
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local path="$1"
            local expected="$2"
            local url="${BASE_URL}${path}"
            local attempts=8
            local wait_seconds=15
            local body
            local headers
            local status
            local final_url

            echo "::group::${url}"

            for attempt in $(seq 1 "${attempts}"); do
              body="$(mktemp)"
              headers="$(mktemp)"

              read -r status final_url < <(
                curl --location --silent --show-error \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --retry 2 \
                  --retry-delay 2 \
                  --header 'Cache-Control: no-cache' \
                  --user-agent 'AirAdmin8-Production-Check/2.0' \
                  --dump-header "${headers}" \
                  --output "${body}" \
                  --write-out '%{http_code} %{url_effective}' \
                  "${url}?healthcheck=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
              ) || true

              status="${status:-000}"
              final_url="${final_url:-unknown}"
              echo "Attempt ${attempt}/${attempts}: HTTP ${status} / ${final_url}"

              if [[ "${status}" == "200" ]] \
                && grep -Fqi -- "${expected}" "${body}" \
                && ! grep -Fqi -- "There isn't a GitHub Pages site here" "${body}" \
                && ! grep -Fqi -- "404 File not found" "${body}"; then
                echo "PASS: ${url}"
                rm -f "${body}" "${headers}"
                echo "::endgroup::"
                return 0
              fi

              if [[ "${status}" == "200" ]]; then
                echo "Response was 200, but required page content was missing or a 404 signature was found."
              fi

              if [[ "${attempt}" -lt "${attempts}" ]]; then
                sleep "${wait_seconds}"
              fi

              rm -f "${body}" "${headers}"
            done

            echo "FAIL: ${url}"
            echo "::endgroup::"
            return 1
          }

          failures=0

          check_page "/" "AirAdmin8" || failures=$((failures + 1))
          check_page "/products.html" "研究用AIロボット製品一覧" || failures=$((failures + 1))
          check_page "/products/unitree-g1-d.html" "Unitree G1-D" || failures=$((failures + 1))
          check_page "/contact.html" "製品・導入" || failures=$((failures + 1))

          if [[ "${failures}" -ne 0 ]]; then
            echo "${failures} production page check(s) failed."
            exit 1
          fi

          echo "All production page checks passed."
