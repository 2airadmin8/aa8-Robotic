name: Auto Remediation V2

on:
  workflow_dispatch:
    inputs:
      category:
        description: Known remediation category
        required: false
        type: choice
        options: [AUTO, HEADER_SYNC, CANONICAL, SITEMAP, ROBOTS, ASSET_404, DEPLOY_SHA, TRANSIENT]
        default: AUTO

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-remediation-v2-manual-${{ github.sha }}
  cancel-in-progress: false

env:
  MAX_ATTEMPTS: '2'
  MAX_FILES: '5'
  MAX_LINES: '300'

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .remediation
          : > .remediation/combined.log

      - name: Diagnose and fingerprint
        id: diagnose
        env:
          MANUAL_CATEGORY: ${{ inputs.category || 'AUTO' }}
          WORKFLOW_NAME: manual
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MANUAL_CATEGORY}" != "AUTO" ]]; then
            category="${MANUAL_CATEGORY}"
            confidence="1.0"
          else
            result="$(python scripts/remediation/diagnose_failure.py .remediation/combined.log)"
            category="$(python -c 'import json,sys; print(json.load(sys.stdin)["category"])' <<<"${result}")"
            confidence="$(python -c 'import json,sys; print(json.load(sys.stdin)["confidence"])' <<<"${result}")"
          fi
          fingerprint="$(printf '%s|%s' "${WORKFLOW_NAME}" "${category}" | sha256sum | cut -c1-12)"
          echo "category=${category}" >> "$GITHUB_OUTPUT"
          echo "confidence=${confidence}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Open or update lifecycle incident
        id: incident
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ steps.diagnose.outputs.category }}
          FINGERPRINT: ${{ steps.diagnose.outputs.fingerprint }}
          WORKFLOW_NAME: manual
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="AUTO-REMEDIATION V2: ${WORKFLOW_NAME} [${CATEGORY}] [${FINGERPRINT}]"
          issue="$(gh issue list --state open --search "${FINGERPRINT} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$issue" ]]; then
            issue="$(gh issue create --title "$title" --body "Lifecycle incident for deterministic remediation. Source: ${SOURCE_RUN}" --json number --jq '.number')"
          fi
          attempts="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --paginate --jq '[.[] | select(.body | startswith("ATTEMPT "))] | length' | tail -1)"
          attempt=$((attempts + 1))
          gh issue comment "$issue" --body "ATTEMPT ${attempt}/${MAX_ATTEMPTS}: category=${CATEGORY}, source=${SOURCE_RUN}"
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"
          echo "attempt=${attempt}" >> "$GITHUB_OUTPUT"

      - name: Stop after maximum attempts
        if: fromJSON(steps.incident.outputs.attempt) > fromJSON(env.MAX_ATTEMPTS)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.incident.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --body "ESCALATED: automatic remediation limit reached. No further code changes will be attempted."
          exit 1

      - name: Apply deterministic fix
        if: >-
          fromJSON(steps.incident.outputs.attempt) <= fromJSON(env.MAX_ATTEMPTS) &&
          contains(fromJSON('["HEADER_SYNC","CANONICAL","SITEMAP","ROBOTS","ASSET_404"]'), steps.diagnose.outputs.category)
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/remediation/apply_known_fix.py '${{ steps.diagnose.outputs.category }}' | tee .remediation/fix-result.txt
          changed="$(git status --porcelain | wc -l | tr -d ' ')"
          lines="$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "lines=${lines}" >> "$GITHUB_OUTPUT"
          test "$changed" -gt 0
          test "$changed" -le "$MAX_FILES"
          test "$lines" -le "$MAX_LINES"

      - name: Validate repaired artifact
        if: steps.fix.outputs.changed != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python -m py_compile scripts/build_site.py scripts/remediation/*.py
          python scripts/build_site.py
          python scripts/inject_main_site_experience.py
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          grep -Fq 'brand-logo-pc' _site/index.html
          grep -Fq 'brand-logo-sp' _site/index.html
          grep -Fq 'data-shared-layout="header"' _site/index.html
          grep -Fq 'Sitemap: https://robotics.air-admin8.co.jp/sitemap.xml' _site/robots.txt
          ! grep -R -Fq 'https://robotics.air-admin8.co.jp/aa8-Robotic/' _site --include='*.html' --include='sitemap.xml'

      - name: Create remediation PR
        if: steps.fix.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ steps.diagnose.outputs.category }}
          FINGERPRINT: ${{ steps.diagnose.outputs.fingerprint }}
          ATTEMPT: ${{ steps.incident.outputs.attempt }}
          ISSUE: ${{ steps.incident.outputs.issue }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/auto-${CATEGORY,,}-${FINGERPRINT}-a${ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- '*.html' sitemap.xml robots.txt includes assets scripts .github || true
          git commit -m "AUTO-FIX V2: ${CATEGORY} [${FINGERPRINT}] attempt ${ATTEMPT}"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "AUTO-FIX V2: ${CATEGORY} [${FINGERPRINT}]" --body "Incident #${ISSUE}. Attempt ${ATTEMPT}/${MAX_ATTEMPTS}. Source: ${SOURCE_RUN}. Deterministic fix only; PR CI must pass before Auto Forward merges.")"
          gh issue comment "$ISSUE" --body "ACTION: remediation PR created: ${pr_url}"

      - name: Escalate unknown or unsafe failure
        if: steps.diagnose.outputs.category == 'UNKNOWN'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.incident.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --body "ESCALATED: unknown category. Automatic code modification was not attempted."
          exit 1
