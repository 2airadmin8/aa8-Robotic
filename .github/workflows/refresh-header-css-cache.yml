name: Refresh header CSS cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-header-css-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CSS cache version in all HTML files
        shell: python
        run: |
          from pathlib import Path
          old = 'review-fixes-20260731.css?v=20260802-5'
          new = 'review-fixes-20260731.css?v=20260802-6'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'updated {changed} html files')

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*.html' '*.html' || true
          git commit -m "chore: refresh header CSS cache"
          git pull --rebase origin main
          git push origin main
