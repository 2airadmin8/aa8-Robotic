name: Drive Backup Export

on:
  push:
    branches:
      - backup-drive-20260818
    paths-ignore:
      - 'backup_export/**'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source archive
        run: |
          rm -rf backup_export
          mkdir -p backup_export
          zip -r backup_export/aa8-Robotic-source-20260818.zip . \
            -x '.git/*' 'backup_export/*'
      - name: Commit source archive to backup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup_export/aa8-Robotic-source-20260818.zip
          git commit -m 'chore: generate Drive source archive' || exit 0
          git push origin HEAD:backup-drive-20260818
