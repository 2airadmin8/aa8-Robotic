name: Drive Backup Export

on:
  push:
    branches:
      - backup-drive-20260818
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source archive
        run: |
          zip -r aa8-Robotic-source-20260818.zip . -x '.git/*' 'aa8-Robotic-source-20260818.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: aa8-Robotic-source-20260818
          path: aa8-Robotic-source-20260818.zip
          if-no-files-found: error
