name: Deploy verified site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python -m py_compile \
            scripts/build_site.py \
            scripts/apply_site_assets.py \
            scripts/verify_release.py \
            scripts/inject_static_meta.py \
            scripts/inject_structured_data.py
          python scripts/build_site.py
          python scripts/inject_static_meta.py
          python scripts/inject_structured_data.py
          python scripts/apply_site_assets.py

      - name: Generate deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          Path("_site/deploy-meta.json").write_text(
              json.dumps(
                  {
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "branch": "main",
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "deployed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify release artifact
        run: python scripts/verify_release.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-and-verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
