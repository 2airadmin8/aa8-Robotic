name: Deploy verified site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python -m py_compile \
            scripts/build_site.py \
            scripts/generate_glossary.py \
            scripts/generate_legacy_redirects.py \
            scripts/verify_glossary.py \
            scripts/verify_display.py \
            scripts/apply_site_assets.py \
            scripts/verify_asset_fingerprints.py \
            scripts/verify_release.py \
            scripts/inject_static_meta.py \
            scripts/inject_structured_data.py
          python scripts/verify_shared_css_ownership.py
          python scripts/build_site.py
          python scripts/generate_glossary.py
          python scripts/generate_legacy_redirects.py
          python scripts/inject_static_meta.py
          python scripts/inject_structured_data.py
          python scripts/apply_site_assets.py
          python scripts/verify_asset_fingerprints.py
          python scripts/verify_glossary.py
          python scripts/verify_display.py

      - name: Generate deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path("_site/deploy-meta.json").write_text(
              json.dumps(
                  {
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "branch": os.environ["GITHUB_REF_NAME"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "deployed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify required release files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release.py
          test -s _site/resources/document.html
          test -s _site/assets/js/document-tracking.js
          test -s '_site/assets/pdf/【AirAdmin8】大学・研究機関向け_AIロボット導入支援のご案内.pdf'
          grep -q 'G-3DCV21L2RT' _site/resources/document.html
          grep -q 'pdf_open' _site/assets/js/document-tracking.js
          grep -q 'delivery_id' _site/assets/js/document-tracking.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 5000

      - name: Verify production release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://robotics.air-admin8.co.jp
        run: |
          set -euo pipefail
          temp_meta="$(mktemp)"
          temp_page="$(mktemp)"
          temp_pdf="$(mktemp)"
          trap 'rm -f "$temp_meta" "$temp_page" "$temp_pdf"' EXIT

          for attempt in $(seq 1 36); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl -fsSL -H 'Cache-Control: no-cache' \
                 "${BASE_URL}/deploy-meta.json?v=${cache_bust}" -o "$temp_meta" \
              && curl -fsSL -H 'Cache-Control: no-cache' \
                 "${BASE_URL}/resources/document.html?v=${cache_bust}" -o "$temp_page" \
              && curl -fsSL -H 'Cache-Control: no-cache' \
                 "${BASE_URL}/assets/pdf/%E3%80%90AirAdmin8%E3%80%91%E5%A4%A7%E5%AD%A6%E3%83%BB%E7%A0%94%E7%A9%B6%E6%A9%9F%E9%96%A2%E5%90%91%E3%81%91_AI%E3%83%AD%E3%83%9C%E3%83%83%E3%83%88%E5%B0%8E%E5%85%A5%E6%94%AF%E6%8F%B4%E3%81%AE%E3%81%94%E6%A1%88%E5%86%85.pdf?v=${cache_bust}" -o "$temp_pdf"; then
              python - "$temp_meta" "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2].lower()
          actual = str(data.get("commit_sha", "")).lower()
          if actual != expected:
              raise SystemExit(f"SHA mismatch: expected={expected} actual={actual}")
          if data.get("branch") != "main":
              raise SystemExit(f"Branch mismatch: {data.get('branch')!r}")
          PY
              grep -q 'G-3DCV21L2RT' "$temp_page"
              grep -q 'document-tracking.js' "$temp_page"
              test -s "$temp_pdf"
              echo "Production verified: ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Production not ready yet (${attempt}/36)."
            sleep 5
          done

          echo "Production verification failed."
          exit 1
