name: Deploy verified site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Production deployment is allowed only from main; got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Checkout exact release revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit shared CSS ownership
        id: css_owner
        continue-on-error: true
        shell: bash
        run: |
          python -m py_compile scripts/verify_shared_css_ownership.py
          python scripts/verify_shared_css_ownership.py

      - name: Build exact release artifact
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python -m py_compile \
            scripts/build_site.py \
            scripts/generate_glossary.py \
            scripts/generate_legacy_redirects.py \
            scripts/verify_glossary.py \
            scripts/verify_display.py \
            scripts/apply_site_assets.py \
            scripts/verify_release.py \
            scripts/inject_static_meta.py \
            scripts/inject_structured_data.py
          python scripts/build_site.py
          python scripts/generate_glossary.py
          python scripts/generate_legacy_redirects.py
          python scripts/inject_static_meta.py
          python scripts/inject_structured_data.py
          python scripts/apply_site_assets.py

      - name: Generate deployment metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path("_site/deploy-meta.json").write_text(
              json.dumps(
                  {
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "branch": os.environ["GITHUB_REF_NAME"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "deployed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify glossary data and pages
        id: glossary
        shell: bash
        run: python scripts/verify_glossary.py

      - name: Audit shared display
        id: display
        continue-on-error: true
        shell: bash
        run: python scripts/verify_display.py

      - name: Verify links, assets and release structure
        id: release
        shell: bash
        run: python scripts/verify_release.py

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Build表示チェックリスト
        if: always()
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅ PASS" ;;
              skipped) echo "⚪ SKIP" ;;
              *) echo "⚠️ WARNING" ;;
            esac
          }
          {
            echo "## Build表示チェックリスト"
            echo "| チェック項目 | 結果 |"
            echo "|---|---|"
            echo "| mainからのRelease | $(status_icon '${{ steps.source.outcome }}') |"
            echo "| 共通CSS所有権（参考） | $(status_icon '${{ steps.css_owner.outcome }}') |"
            echo "| Build・構文 | $(status_icon '${{ steps.build.outcome }}') |"
            echo "| 用語集データ・詳細ページ | $(status_icon '${{ steps.glossary.outcome }}') |"
            echo "| Header / Footer共通化（参考） | $(status_icon '${{ steps.display.outcome }}') |"
            echo "| PC / SP Logo（参考） | $(status_icon '${{ steps.display.outcome }}') |"
            echo "| SPメニュー表示・動作配線（参考） | $(status_icon '${{ steps.display.outcome }}') |"
            echo "| リンク・画像・旧パス除去 | $(status_icon '${{ steps.release.outcome }}') |"
            echo "| Sitemap・robots・SEO構造 | $(status_icon '${{ steps.release.outcome }}') |"
            echo "| 旧URL移行ページ | $(status_icon '${{ steps.release.outcome }}') |"
            echo "| Deploy metadata | $(status_icon '${{ steps.metadata.outcome }}') |"
            echo "| Pages artifact | $(status_icon '${{ steps.upload.outcome }}') |"
            echo ""
            echo "Release SHA: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact production SHA
        id: production_sha
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://robotics.air-admin8.co.jp
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          trap 'rm -f "${temp_file}"' EXIT

          for attempt in $(seq 1 24); do
            if curl -fsSL -H 'Cache-Control: no-cache' \
              "${BASE_URL}/deploy-meta.json?release=${GITHUB_RUN_ID}-${attempt}" \
              -o "${temp_file}"; then
              if python - "${temp_file}" "${EXPECTED_SHA}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected = sys.argv[2].lower()
          data = json.loads(path.read_text(encoding="utf-8"))
          actual = str(data.get("commit_sha", "")).lower()
          branch = data.get("branch")

          if not re.fullmatch(r"[0-9a-f]{40}", actual):
              raise SystemExit(f"Invalid production commit SHA: {actual!r}")
          if actual != expected:
              raise SystemExit(f"Production SHA mismatch: expected={expected} actual={actual}")
          if branch != "main":
              raise SystemExit(f"Production branch mismatch: expected=main actual={branch!r}")
          print(f"Verified production SHA: {actual}")
          PY
              then
                exit 0
              fi
            fi
            echo "Production has not reached ${EXPECTED_SHA} yet (attempt ${attempt}/24)."
            sleep 5
          done

          echo "Production SHA did not converge to ${EXPECTED_SHA}."
          exit 1

      - name: 本番表示チェックリスト
        if: always()
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅ PASS" ;;
              skipped) echo "⚪ SKIP" ;;
              *) echo "❌ FAIL" ;;
            esac
          }
          {
            echo "## 本番表示チェックリスト"
            echo "| チェック項目 | 結果 |"
            echo "|---|---|"
            echo "| Pages設定 | $(status_icon '${{ steps.configure.outcome }}') |"
            echo "| 本番Deploy | $(status_icon '${{ steps.deployment.outcome }}') |"
            echo "| 本番SHA一致 | $(status_icon '${{ steps.production_sha.outcome }}') |"
            echo ""
            echo "Expected SHA: \`${GITHUB_SHA}\`"
            echo "Production: https://robotics.air-admin8.co.jp/"
          } >> "$GITHUB_STEP_SUMMARY"
