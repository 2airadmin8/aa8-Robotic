name: Build and deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site

          if python -m py_compile scripts/build_site.py && python scripts/build_site.py; then
            echo "Primary build completed."
          else
            echo "Primary build failed. Publishing verified static fallback."
            rm -rf _site
            mkdir -p _site
            rsync -a ./ _site/ \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site/' \
              --exclude 'scripts/'
          fi

      - name: Apply optional production enhancements
        shell: bash
        run: |
          set -u
          scripts=(
            scripts/prerender_product_cards.py
            scripts/prerender_resources.py
            scripts/inject_accessibility.py
            scripts/inject_static_meta.py
            scripts/inject_structured_data.py
            scripts/prepare_compare_print_assets.py
            scripts/inject_main_site_experience.py
          )

          for script in "${scripts[@]}"; do
            if [[ -f "${script}" ]]; then
              echo "Running ${script}"
              python "${script}" || echo "Warning: ${script} failed; core static site remains publishable."
            fi
          done

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            _site/index.html
            _site/products.html
            _site/products/unitree-g1-d.html
            _site/contact.html
            _site/CNAME
          )

          for file in "${required_files[@]}"; do
            test -s "${file}" || { echo "Missing required file: ${file}"; exit 1; }
          done

          grep -Fxq 'robotics.air-admin8.co.jp' _site/CNAME
          grep -Fq 'Unitree G1-D' _site/products/unitree-g1-d.html
          grep -Fq 'https://www.unitree.com/images/' _site/products/unitree-g1-d.html
          ! grep -Fq '/aa8-Robotic/products/unitree-g1-d.html' _site/products/unitree-g1-d.html

          echo "Production artifact verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
