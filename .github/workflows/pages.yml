name: Build and deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check "${file}"
          done

      - name: Validate product and resource catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_catalog.py
          python scripts/validate_catalog.py

      - name: Validate SEO keyword ownership
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_seo.py
          python scripts/validate_seo.py

      - name: Validate GA4 event registry
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_analytics.py
          python scripts/validate_analytics.py

      - name: Validate case evidence and progress
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_cases.py
          python scripts/validate_cases.py

      - name: Validate Search Console readiness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_search_index.py
          python scripts/validate_search_index.py

      - name: Build site with safe fallback
        shell: bash
        run: |
          set +e
          python -m py_compile scripts/build_site.py > build.log 2>&1
          COMPILE_STATUS=$?

          if [ "$COMPILE_STATUS" -eq 0 ]; then
            python scripts/build_site.py >> build.log 2>&1
            BUILD_STATUS=$?
          else
            BUILD_STATUS=$COMPILE_STATUS
          fi

          if [ "$BUILD_STATUS" -ne 0 ] || [ ! -f "_site/index.html" ]; then
            echo "Primary build failed. Publishing safe static fallback." | tee -a build.log
            rm -rf _site
            mkdir -p _site
            rsync -a ./ _site/ \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site/' \
              --exclude 'scripts/'

            python - <<'PY'
          import json
          from pathlib import Path

          log = Path("build.log").read_text(encoding="utf-8", errors="replace")
          report = {
              "status": "fallback_build",
              "message": "Primary build failed; raw static files were published.",
              "build_log_tail": log[-12000:],
          }
          Path("_site/qa-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          else
            echo "Primary build completed successfully." | tee -a build.log
          fi

          test -f _site/index.html
          test -f _site/qa-report.json
          exit 0

      - name: Pre-render public product cards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/prerender_product_cards.py
          python scripts/prerender_product_cards.py

      - name: Pre-render public resource cards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/prerender_resources.py
          python scripts/prerender_resources.py

      - name: Inject accessibility helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/inject_accessibility.py
          python scripts/inject_accessibility.py

      - name: Inject static browser and social metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/inject_static_meta.py
          python scripts/inject_static_meta.py

      - name: Inject static structured data
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/inject_structured_data.py
          python scripts/inject_structured_data.py

      - name: Prepare and validate comparison print assets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_compare_print_assets.py
          python scripts/prepare_compare_print_assets.py

      - name: Generate deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "deployed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          Path("_site/deploy-meta.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          test -f _site/deploy-meta.json
          cat _site/deploy-meta.json

      - name: Smoke-test built Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_built_site.py
          python scripts/validate_built_site.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("_site/deploy-meta.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          required = {"commit_sha", "branch", "run_id", "deployed_at"}
          missing = required - data.keys()
          if missing:
              raise SystemExit(f"deploy-meta.json missing keys: {sorted(missing)}")
          PY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-diagnostics
          path: |
            build.log
            _site/qa-report.json
            _site/deploy-meta.json
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production commit
        shell: bash
        env:
          PROD_META_URL: https://robotics.air-admin8.co.jp/aa8-Robotic/deploy-meta.json
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            echo "Verification attempt ${attempt}/12"
            response="$(curl -fsSL --retry 2 --retry-delay 2 "${PROD_META_URL}?cache_bust=${GITHUB_RUN_ID}-${attempt}" || true)"

            actual_sha="$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("commit_sha", ""))' <<<"${response}" 2>/dev/null || true)"

            echo "Expected SHA: ${EXPECTED_SHA}"
            echo "Actual SHA:   ${actual_sha:-<empty>}"

            if [ "${actual_sha}" = "${EXPECTED_SHA}" ]; then
              echo "Production deployment verified."
              exit 0
            fi

            sleep 15
          done

          echo "Production commit verification failed."
          echo "URL: ${PROD_META_URL}"
          exit 1
