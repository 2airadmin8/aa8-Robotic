name: Publish approved SP logo 135x35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sp-logo-135x35.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sp-logo-135x35
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write approved SP SVG
        shell: bash
        env:
          SVG_GZIP_BASE64: 
        run: |
          set -euo pipefail
          mkdir -p assets/img
          printf '%s' "$SVG_GZIP_BASE64" | base64 -d | gzip -d > assets/img/logo-airadmin8-robotics-sp.svg
          grep -q '<svg width="135" height="35" viewBox="0 0 135 35"' assets/img/logo-airadmin8-robotics-sp.svg

      - name: Update SP header CSS
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('assets/css/site.css')
          css = p.read_text(encoding='utf-8')
          css = re.sub(r'/\* SP logo 135x35 - approved 20260802 \*/\s*@media \(max-width:640px\)\{.*?\}\s*$', '', css, flags=re.S).rstrip()
          css += '''

/* SP logo 135x35 - approved 20260802 */
@media (max-width:640px){
  .header-inner{min-height:60px}
  .brand{
    width:135px;
    height:35px;
    flex:0 0 135px;
    display:block;
    background-image:url('../img/logo-airadmin8-robotics-sp.svg?v=20260802-135x35-final');
    background-position:left center;
    background-size:135px 35px;
    background-repeat:no-repeat;
    font-size:0;
    line-height:0;
  }
  .brand>*{display:none!important}
}
'''
          p.write_text(css, encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'width="135" height="35" viewBox="0 0 135 35"' assets/img/logo-airadmin8-robotics-sp.svg
          grep -q 'background-size:135px 35px' assets/css/site.css
          grep -q 'logo-airadmin8-robotics-sp.svg?v=20260802-135x35-final' assets/css/site.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/logo-airadmin8-robotics-sp.svg assets/css/site.css
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git commit -m "style: publish latest SP logo 135x35"
          git pull --rebase origin main
          git push origin main
