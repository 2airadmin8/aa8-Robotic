name: Publish approved SP logo 135x35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sp-logo-135x35.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sp-logo-135x35
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved SP SVG
        shell: bash
        run: |
          set -euo pipefail
          target="assets/img/logo-airadmin8-robotics-sp.svg"
          tmp="${target}.tmp"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            "https://drive.usercontent.google.com/download?id=1PdhIDhMVfVdBnMse1s91BqSNgwGbS8pN&export=download&confirm=t" \
            -o "$tmp"
          grep -q '<svg width="135" height="35" viewBox="0 0 135 35"' "$tmp"
          grep -q '#0069B5' "$tmp"
          grep -q '#00B2BC' "$tmp"
          if grep -Eqi '#ff|magenta|pink' "$tmp"; then
            echo "Unexpected red/pink color found in SVG" >&2
            exit 1
          fi
          mv "$tmp" "$target"

      - name: Update SP header logo sizing
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('assets/css/site.css')
          css = path.read_text(encoding='utf-8')
          css = re.sub(
              r'/\* SP logo 135x35 - approved 20260802 \*/\s*@media \(max-width:640px\)\{.*?\}\s*$',
              '',
              css,
              flags=re.S,
          ).rstrip()
          css += '''

/* SP logo 135x35 - approved 20260802 */
@media (max-width:640px){
  .header-inner{min-height:60px}
  .brand{
    width:135px;
    height:35px;
    flex:0 0 135px;
    display:block;
    background-image:url('../img/logo-airadmin8-robotics-sp.svg?v=20260802-135x35');
    background-position:left center;
    background-size:135px 35px;
    background-repeat:no-repeat;
    font-size:0;
    line-height:0;
  }
  .brand>*{display:none!important}
}
'''
          path.write_text(css, encoding='utf-8')

      - name: Validate repository result
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'width="135" height="35" viewBox="0 0 135 35"' assets/img/logo-airadmin8-robotics-sp.svg
          grep -q 'SP logo 135x35' assets/css/site.css
          grep -q "background-size:135px 35px" assets/css/site.css

      - name: Commit production SP logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/logo-airadmin8-robotics-sp.svg assets/css/site.css
          if git diff --cached --quiet; then
            echo "Approved SP logo is already published."
            exit 0
          fi
          git commit -m "style: publish approved SP logo 135x35"
          git pull --rebase origin main
          git push origin main

