name: Fix site cache and canonical

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-site-cache-and-canonical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update HTML references
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(
                  r'assets/css/site\.css\?v=[^"\']+',
                  'assets/css/site.css?v=20260802-1',
                  text,
              )
              text = re.sub(
                  r'assets/css/review-fixes-20260731\.css\?v=[^"\']+',
                  'assets/css/review-fixes-20260731.css?v=20260802-5',
                  text,
              )
              text = text.replace(
                  'https://2airadmin8.github.io/aa8-Robotic/',
                  'https://robotics.air-admin8.co.jp/',
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)

      - name: Validate key files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://robotics.air-admin8.co.jp/' index.html
          grep -q 'site.css?v=20260802-1' index.html
          grep -q 'review-fixes-20260731.css?v=20260802-5' index.html
          grep -q 'width: 180px' assets/css/review-fixes-20260731.css
          grep -q 'width: 135px' assets/css/review-fixes-20260731.css
          ! grep -R "content: 'ロボティックス'" assets/css

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No HTML changes required.'
            exit 0
          fi
          git commit -m 'fix: refresh site CSS cache and canonical URLs'
          git pull --rebase origin main
          git push origin main
