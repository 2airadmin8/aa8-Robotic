name: Use uploaded logo directly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/use-uploaded-logo-directly.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace header logo markup with uploaded files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          version = '20260802-uploaded-logo-direct'

          for path in repo.rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              depth = len(path.parent.parts)
              prefix = '../' * depth
              picture = (
                  f'<picture class="brand-picture">'
                  f'<source media="(max-width: 640px)" srcset="{prefix}assets/img/logo-airadmin8-robotics-sp.svg?v={version}">'
                  f'<img src="{prefix}assets/img/logo-airadmin8-robotics-pc.svg?v={version}" '
                  f'alt="AirAdmin8 Robotics" width="180" height="42">'
                  f'</picture>'
              )
              pattern = re.compile(r'(<a\s+class="brand"[^>]*>).*?(</a>)', re.S)
              new_text, count = pattern.subn(lambda m: m.group(1) + picture + m.group(2), text, count=1)
              new_text = re.sub(
                  r'review-fixes-20260731\.css\?v=[^"\']+',
                  f'review-fixes-20260731.css?v={version}',
                  new_text,
              )
              if count or new_text != text:
                  path.write_text(new_text, encoding='utf-8')

          css_path = repo / 'assets/css/review-fixes-20260731.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* uploaded-logo-direct */'
          block = r'''

          /* uploaded-logo-direct */
          .site-header .brand {
            background: none !important;
            overflow: visible !important;
          }
          .site-header .brand > .brand-picture {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
          }
          .site-header .brand > .brand-picture img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            object-position: left center !important;
          }
          '''
          if marker not in css:
              css_path.write_text(css + block, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: use manually uploaded PC and SP logo files directly"
          git pull --rebase origin main
          git push origin main
