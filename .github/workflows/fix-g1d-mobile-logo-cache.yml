name: Fix G1-D mobile logo cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-g1d-mobile-logo-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump logo CSS and asset cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('products/unitree-g1-d.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('/assets/css/main-logo.css?v=20260802-g1d3', '/assets/css/main-logo.css?v=20260803-logo-final')
          text = text.replace('/assets/img/logo-airadmin8-robotics-sp.svg?v=20260802-common', '/assets/img/logo-airadmin8-robotics-sp.svg?v=20260803-logo-final')
          text = text.replace('/assets/img/logo-airadmin8-robotics-pc.svg?v=20260802-common', '/assets/img/logo-airadmin8-robotics-pc.svg?v=20260803-logo-final')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-g1d-mobile-logo-cache.yml').unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q 'main-logo.css?v=20260803-logo-final' products/unitree-g1-d.html
          grep -q 'logo-airadmin8-robotics-sp.svg?v=20260803-logo-final' products/unitree-g1-d.html
          test ! -e .github/workflows/fix-g1d-mobile-logo-cache.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh G1-D mobile logo assets'
          git pull --rebase origin main
          git push origin main
