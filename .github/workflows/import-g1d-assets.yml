name: Import G1-D Assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-g1d-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-g1d-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download G1-D assets
        shell: bash
        run: |
          set -euo pipefail
          DEST="assets/img/products/unitree-g1-d"
          mkdir -p "$DEST"

          drive_download() {
            local id="$1" filename="$2" target="$DEST/$filename" tmp="$DEST/.${filename}.tmp"
            rm -f "$tmp"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 240 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$tmp"
            test -s "$tmp"
            mv "$tmp" "$target"
          }

          # User-provided final specification/support sheets
          drive_download "19Dm26D3aVk98FuIif2aX9TByTNxZiLwx" "g1-d-specification-p03.png"
          drive_download "1YWPbJsV9RI3jHTTY_fCnJZ4A1QxzWbpM" "g1-d-workflow-support-p05.png"

          # User-provided application scenario images
          drive_download "1C2tCsWmHpIHrH_s44Kh8k_wWD9jTY4oF" "scenario-service.jpg"
          drive_download "1WEXAmge5ujlRJwMAW2i2qcMm44uNIxCj" "scenario-life.jpg"
          drive_download "1zv3iGClHhJo_CNYuFakg6fvHIzWxwKtn" "scenario-retail.jpg"
          drive_download "1hVVh3WWZeuY5CQ4Q8xjHEEN8-ssZZC1w" "scenario-industry.jpg"

      - name: Validate new assets
        shell: bash
        run: |
          set -euo pipefail
          DEST="assets/img/products/unitree-g1-d"
          for file in \
            g1-d-specification-p03.png \
            g1-d-workflow-support-p05.png \
            scenario-service.jpg \
            scenario-life.jpg \
            scenario-retail.jpg \
            scenario-industry.jpg; do
            test -s "$DEST/$file"
            size="$(stat -c%s "$DEST/$file")"
            test "$size" -gt 10000
            mime="$(file --brief --mime-type "$DEST/$file")"
            case "$mime" in image/png|image/jpeg) ;; *) exit 1 ;; esac
            echo "OK: $file ($mime, $size bytes)"
          done

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/products/unitree-g1-d
          if git diff --cached --quiet; then
            echo "Assets already current."
            exit 0
          fi
          git commit -m "assets: add final G1-D specs, support sheet and scenario images"
          git pull --rebase origin main
          git push origin main
