name: Import G1-D Assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-g1d-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-g1d-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original G1-D assets
        shell: bash
        run: |
          set -euo pipefail

          DEST="assets/img/products/unitree-g1-d"
          mkdir -p "$DEST"

          download() {
            local id="$1"
            local filename="$2"
            local target="$DEST/$filename"
            local tmp="${target}.tmp"

            echo "Downloading ${filename}"
            rm -f "$tmp" "$target"

            curl --fail --location --retry 4 --retry-delay 3 \
              --connect-timeout 20 --max-time 180 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$tmp" || true

            if ! test -s "$tmp" || file --brief --mime-type "$tmp" | grep -Eq '^text/html'; then
              rm -f "$tmp"
              curl --fail --location --retry 4 --retry-delay 3 \
                --connect-timeout 20 --max-time 180 \
                "https://drive.google.com/uc?export=download&id=${id}&confirm=t" \
                --output "$tmp"
            fi

            test -s "$tmp"
            mv "$tmp" "$target"
          }

          download "10seNM_Mt8SFZg2zZRHwsFsT1vLUKtZQG" "g1-d-hero-white.png"
          download "1bosSUX76lov8VbBanq7b2oOEO3UEkdZP" "g1-d-body.png"
          download "1l_fwsOBuRlof5nYjahVQYhY-iAdop3jQ" "g1-d-thumbnail-450.png"
          download "13_Vek6JS1Z8sa9XCmoqGihabW0iLn5Fb" "g1-d-product-overview.jpg"
          download "1amYu1ENoULRNwy7C0RbJqF59OIJh18SK" "g1-d-body-02.png"
          download "1NLeiw8oMiz_tfK4PnWTP9XAvDaqxrMc3" "g1-d-logistics.png"
          download "15lXKnmVcK3jchN2UBZEc8tWndTQ_iAqL" "g1-d-teleoperation-vr.png"
          download "1lVD__wN26b1wsZq_s_DUORkgNP1v3XOs" "data-collection-01-create-task.png"
          download "1vn9vDBWjJwb5lnfMOL34MM15JiBUKKVM" "data-collection-02-edit-assignment.png"
          download "17qmcUBETZRTkBm4uPHOwbO-BMvBsvFzT" "data-collection-03-acquisition-annotation.png"
          download "17PGlJJ8Hl0i-I0XrTDkMyIFzzIkCKbey" "data-collection-04-upload-review.png"
          download "1k6A-CWFYLwDDaiyH_5P6WmxgiM-YPRUt" "data-collection-05-storage.png"
          download "1RmDcKdPjj5VbnIEAAE6UHk5-bJA2JfD_" "data-collection-06-export.png"
          download "1er_GQ_oJOTIHxzs-0A9UC-esmHQlsomU" "model-lifecycle-01-architecture.png"
          download "1h5xX5u6aNVQD_X3Lqz2A5bmRvMGvKuSF" "model-lifecycle-02-training.png"
          download "1w1_JGT5TyGoi9sK0iii2zSTdPTLOjEo4" "model-lifecycle-03-monitoring.png"
          download "1BgDRqiGktxunsplNN0-5SlTYrR9_jh9o" "model-lifecycle-04-parameter-editing.png"
          download "1HHEsvx_dL0Rg7coWdccgKhPD-e_0ee_S" "model-lifecycle-05-simulation.png"
          download "18fEBRDs7Ew3rjgiRBSeSZDpWBry0KQZD" "model-lifecycle-06-deployment.png"

      - name: Validate downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          DEST="assets/img/products/unitree-g1-d"
          count="$(find "$DEST" -maxdepth 1 -type f ! -name README.md | wc -l | tr -d ' ')"
          test "$count" -eq 19

          while IFS= read -r file; do
            size="$(stat -c%s "$file")"
            test "$size" -gt 10000
            mime="$(file --brief --mime-type "$file")"
            case "$mime" in
              image/png|image/jpeg) ;;
              *) echo "Invalid file type: $file ($mime)"; exit 1 ;;
            esac
            echo "OK: $file ($mime, $size bytes)"
          done < <(find "$DEST" -maxdepth 1 -type f ! -name README.md | sort)

      - name: Write asset manifest
        shell: bash
        run: |
          cat > assets/img/products/unitree-g1-d/README.md <<'EOF'
          # Unitree G1-D image assets

          Original product and workflow materials supplied for the AirAdmin8 Robotics G1-D product page.

          - Product body and hero images
          - Logistics and teleoperation scenes
          - Six-step data collection workflow
          - Six-step model lifecycle workflow

          Do not redraw, recolor, distort, or change the product shape. Use `object-fit: contain` for product images.
          EOF

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/products/unitree-g1-d

          if git diff --cached --quiet; then
            echo "Assets are already up to date."
            exit 0
          fi

          git commit -m "assets: add 19 original Unitree G1-D images"
          git pull --rebase origin main
          git push origin main
