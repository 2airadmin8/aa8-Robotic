name: Sync shared header

on:
  push:
    branches: [main]
    paths:
      - includes/site-header.html
      - .github/workflows/sync-shared-header.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared header to every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          header = (root / 'includes/site-header.html').read_text(encoding='utf-8').strip()
          header_pattern = re.compile(r'<header\s+class="site-header"[^>]*>.*?</header>', re.S)
          changed = []
          missing = []

          for path in root.rglob('*.html'):
              if path.parts[0] in {'.git', '.github', 'includes'}:
                  continue
              text = path.read_text(encoding='utf-8')
              new_text, count = header_pattern.subn(header, text, count=1)
              if count == 0:
                  missing.append(str(path))
                  continue
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print(f'updated: {len(changed)}')
          for item in changed:
              print(item)

          if missing:
              print('Pages without standard header:')
              for item in missing:
                  print(item)

          # Hard validation: no page may retain relative logo paths or duplicate header.
          errors = []
          for path in root.rglob('*.html'):
              if path.parts[0] in {'.git', '.github', 'includes'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if text.count('<header class="site-header">') != 1:
                  errors.append(f'{path}: header count is not 1')
              if 'logo-airadmin8-robotics-sp.svg' in text and '/assets/img/logo-airadmin8-robotics-sp.svg' not in text:
                  errors.append(f'{path}: SP logo path is not root-absolute')
              if 'logo-airadmin8-robotics-pc.svg' in text and '/assets/img/logo-airadmin8-robotics-pc.svg' not in text:
                  errors.append(f'{path}: PC logo path is not root-absolute')

          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Commit synchronized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No page changes required."
            exit 0
          fi
          git commit -m "fix: synchronize shared header across all pages"
          git pull --rebase origin main
          git push origin main
