name: Publish PC logo 194x50

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pc-logo-194x50.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PC logo override
        shell: bash
        run: |
          set -euo pipefail
          marker='/* PC logo 194x50 - 20260802 */'
          if grep -Fq "$marker" assets/css/site.css; then
            echo 'PC logo override already exists.'
            exit 0
          fi
          cat >> assets/css/site.css <<'CSS'
          /* PC logo 194x50 - 20260802 */
          @media (min-width:641px){
            .header-inner{min-height:72px}
            .brand{
              width:194px;
              height:50px;
              flex:0 0 194px;
              display:block;
              background-image:url('../img/logo-airadmin8-robotics-pc.svg');
              background-position:left center;
              background-size:194px 50px;
              background-repeat:no-repeat;
              font-size:0;
              line-height:0;
            }
            .brand>*{display:none!important}
          }
          CSS

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/img/logo-airadmin8-robotics-pc.svg
          grep -q '<svg width="194" height="50" viewBox="0 0 194 50"' assets/img/logo-airadmin8-robotics-pc.svg
          grep -q 'logo-airadmin8-robotics-pc.svg' assets/css/site.css

      - name: Commit production update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'style: publish PC logo 194x50 SVG'
          git pull --rebase origin main
          git push origin main
