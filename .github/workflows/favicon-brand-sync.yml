name: Favicon Brand Sync

on:
  push:
    branches: [main]
    paths:
      - 'assets/img/airadmin8-192x192.svg'
      - '.github/workflows/favicon-brand-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: favicon-brand-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and sync favicon references
        shell: bash
        run: |
          set -euo pipefail

          ICON='assets/img/airadmin8-192x192.svg'
          VERSION='20260803-brand-v1'

          test -f "$ICON"
          test "$(wc -c < "$ICON")" -lt 102400
          grep -Fq '<svg' "$ICON"
          grep -Fq 'viewBox="0 0 192 192"' "$ICON"

          python3 - <<'PY'
          from pathlib import Path

          marker = 'data-aa8-brand-icon="true"'
          block = '''  <!-- AirAdmin8ブランドアイコン：全ページ共通 -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/img/airadmin8-192x192.svg?v=20260803-brand-v1" data-aa8-brand-icon="true">
  <link rel="shortcut icon" href="/assets/img/airadmin8-192x192.svg?v=20260803-brand-v1" data-aa8-brand-icon="true">
'''

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules', 'vendor'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'ERROR: </head> missing: {path}')
              text = text.replace('</head>', f'{block}</head>', 1)
              path.write_text(text, encoding='utf-8', newline='\n')
              changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)
          PY

      - name: Commit synchronized HTML
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Favicon references already synchronized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'BUILD: AirAdmin8 faviconを全HTMLへ同期 [skip favicon-sync]'
          git push origin HEAD:main
