name: Production Release Check

on:
  workflow_run:
    workflows: ["Deploy verified site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected 40-character production commit SHA (optional)"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_URL: https://robotics.air-admin8.co.jp

concurrency:
  group: production-release-check
  cancel-in-progress: true

jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment trigger result
        id: deployment_gate
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          DEPLOYMENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYMENT_CONCLUSION}" != "success" ]]; then
            echo "Upstream GitHub Pages deployment failed: ${DEPLOYMENT_CONCLUSION}"
            exit 1
          fi
          echo "Upstream GitHub Pages deployment succeeded."

      - name: Checkout main
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify expected production SHA
        id: production_sha
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          expected="${INPUT_SHA:-}"
          if [[ -z "${expected}" && "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            expected="${WORKFLOW_SHA:-}"
          fi

          temp_file="$(mktemp)"
          trap 'rm -f "${temp_file}"' EXIT
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache'             "${BASE_URL}/deploy-meta.json?check=${GITHUB_RUN_ID}" -o "${temp_file}"

          python - "${temp_file}" "${expected}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2].strip().lower()
          actual = str(data.get("commit_sha", "")).strip().lower()
          branch = data.get("branch")

          if not re.fullmatch(r"[0-9a-f]{40}", actual):
              raise SystemExit(f"Invalid production commit SHA: {actual!r}")
          if branch != "main":
              raise SystemExit(f"Production branch mismatch: expected=main actual={branch!r}")
          if expected:
              if not re.fullmatch(r"[0-9a-f]{40}", expected):
                  raise SystemExit(f"Invalid expected SHA: {expected!r}")
              if actual != expected:
                  raise SystemExit(f"Production SHA mismatch: expected={expected} actual={actual}")
          print(f"Verified production SHA: {actual}")
          PY

      - name: Audit every production URL from sitemap
        id: site_audit
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_production_site.py
          python scripts/audit_production_site.py             --base-url "${BASE_URL}"             --json production-audit.json             --markdown production-audit.md

      - name: Validate Slack alert configuration
        id: slack_config
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured. GitHub Actions failure email remains the fallback alert channel."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Slack alert configuration is present."

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Release Check"
            echo ""
            case '${{ steps.deployment_gate.outcome }}' in
              success|skipped) echo "- Deploy trigger: ✅ PASS" ;;
              *) echo "- Deploy trigger: ❌ FAIL" ;;
            esac
            case '${{ steps.production_sha.outcome }}' in
              success) echo "- 本番SHA: ✅ PASS" ;;
              skipped) echo "- 本番SHA: ⚪ SKIP" ;;
              *) echo "- 本番SHA: ❌ FAIL" ;;
            esac
            case '${{ steps.site_audit.outcome }}' in
              success) echo "- 全URL監査: ✅ PASS" ;;
              skipped) echo "- 全URL監査: ⚪ SKIP" ;;
              *) echo "- 全URL監査: ❌ FAIL" ;;
            esac
            if [[ '${{ steps.slack_config.outputs.configured }}' == 'true' ]]; then
              echo "- Slack通知設定: ✅ PASS"
            else
              echo "- Slack通知設定: ⚠️ 未設定（GitHub Actions失敗通知をフォールバック使用）"
            fi
            echo ""
            if [[ -f production-audit.md ]]; then
              cat production-audit.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-site-audit-${{ github.run_id }}
          path: |
            production-audit.json
            production-audit.md
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured; skipping Slack delivery. The original production-check failure is preserved."
            exit 0
          fi

          payload="$(python - <<'PY'
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          server = os.environ["GITHUB_SERVER_URL"]
          sha = os.environ["GITHUB_SHA"]
          text = (
              "🚨 AirAdmin8 Robotics Production Release Check failed\n"
              f"Repository: {repo}\n"
              f"Run: {server}/{repo}/actions/runs/{run_id}\n"
              f"Commit: {sha}"
          )
          print(json.dumps({"text": text}, ensure_ascii=False))
          PY
          )"

          curl -fsSL -X POST             -H 'Content-type: application/json'             --data "${payload}"             "${SLACK_WEBHOOK_URL}"
