name: Production Release Check

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected 40-character production commit SHA (leave blank for scheduled-style health check)"
        required: false
        type: string
  schedule:
    - cron: "17 0,3,6,9 * * 1-5"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: production-release-check
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://robotics.air-admin8.co.jp
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Verify production release evidence
        id: production
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "${temp_dir}"' EXIT

          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/?check=${GITHUB_RUN_ID}" -o "${temp_dir}/index.html"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/products.html?check=${GITHUB_RUN_ID}" -o "${temp_dir}/products.html"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/glossary.html?check=${GITHUB_RUN_ID}" -o "${temp_dir}/glossary.html"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/css/shared-layout.css?check=${GITHUB_RUN_ID}" -o "${temp_dir}/shared-layout.css"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/img/airadmin8-robotics-logo-pc.svg?check=${GITHUB_RUN_ID}" -o "${temp_dir}/pc.svg"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/img/airadmin8-robotics-logo-sp.svg?check=${GITHUB_RUN_ID}" -o "${temp_dir}/sp.svg"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/robots.txt?check=${GITHUB_RUN_ID}" -o "${temp_dir}/robots.txt"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/sitemap.xml?check=${GITHUB_RUN_ID}" -o "${temp_dir}/sitemap.xml"
          curl -fsSL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' "${BASE_URL}/deploy-meta.json?check=${GITHUB_RUN_ID}" -o "${temp_dir}/deploy-meta.json"

          for page in index.html products.html glossary.html; do
            grep -Fq 'data-shared-layout="header"' "${temp_dir}/${page}"
            grep -Fq 'data-shared-layout="footer"' "${temp_dir}/${page}"
            grep -Fq 'airadmin8-robotics-logo-pc.svg' "${temp_dir}/${page}"
            grep -Fq 'airadmin8-robotics-logo-sp.svg' "${temp_dir}/${page}"
            grep -Fq 'data-aa8-menu-runtime="true"' "${temp_dir}/${page}"
            grep -Fq "classList.toggle('open')" "${temp_dir}/${page}"
            ! grep -Fq '/aa8-Robotic/' "${temp_dir}/${page}"
            ! grep -Fq '重点解説' "${temp_dir}/${page}"
          done

          grep -Fq 'id="glossary-search"' "${temp_dir}/glossary.html"
          grep -Fq '<svg' "${temp_dir}/pc.svg"
          grep -Fq '<svg' "${temp_dir}/sp.svg"
          grep -Fq 'Sitemap: https://robotics.air-admin8.co.jp/sitemap.xml' "${temp_dir}/robots.txt"
          grep -Fq 'https://robotics.air-admin8.co.jp/glossary.html' "${temp_dir}/sitemap.xml"

          python - "${temp_dir}/deploy-meta.json" "${EXPECTED_SHA}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2].strip().lower()
          actual = str(data.get("commit_sha", "")).strip().lower()
          branch = data.get("branch")

          if not re.fullmatch(r"[0-9a-f]{40}", actual):
              raise SystemExit(f"Invalid production commit SHA: {actual!r}")
          if branch != "main":
              raise SystemExit(f"Production branch mismatch: expected=main actual={branch!r}")
          if expected:
              if not re.fullmatch(r"[0-9a-f]{40}", expected):
                  raise SystemExit(f"Invalid expected SHA: {expected!r}")
              if actual != expected:
                  raise SystemExit(f"Production SHA mismatch: expected={expected} actual={actual}")
          print(actual)
          PY

      - name: 本番表示チェックリスト
        if: always()
        shell: bash
        run: |
          case '${{ steps.production.outcome }}' in
            success) result='✅ PASS' ;;
            *) result='❌ FAIL' ;;
          esac
          {
            echo "## 本番表示チェックリスト"
            echo "| チェック項目 | 結果 |"
            echo "|---|---|"
            echo "| Header / Footer共通表示 | ${result} |"
            echo "| PC / SP Logo | ${result} |"
            echo "| SPメニュー配線 | ${result} |"
            echo "| 用語集検索・表示 | ${result} |"
            echo "| リンク・旧パス除去 | ${result} |"
            echo "| Sitemap・robots | ${result} |"
            echo "| 本番branch / SHA | ${result} |"
            echo ""
            echo "Production: ${BASE_URL}/"
          } >> "$GITHUB_STEP_SUMMARY"
