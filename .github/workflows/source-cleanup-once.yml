name: One-time source cleanup

on:
  push:
    branches:
      - release/physical-ai-site-v1.0.0
    paths:
      - .github/workflows/source-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/physical-ai-site-v1.0.0
          fetch-depth: 0

      - name: Remove legacy logo sources
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('products/unitree-g1-d.html')
          text = html.read_text(encoding='utf-8')
          text = re.sub(r'\s*<link\b[^>]*href=["\'][^"\']*main-logo\.css[^"\']*["\'][^>]*>', '', text, flags=re.I)
          html.write_text(text, encoding='utf-8')

          review = Path('assets/css/review-fixes-20260731.css')
          text = review.read_text(encoding='utf-8')
          text = re.sub(r'\n?\.site-header \.brand\s*>\s*\*\s*\{\s*display\s*:\s*none\s*!important;?\s*\}\s*', '\n', text, flags=re.I)
          review.write_text(text, encoding='utf-8')

          hub = Path('assets/css/content-hub.css')
          text = hub.read_text(encoding='utf-8')
          text = text.replace("/* 2026-08-03 mobile header emergency fix\n   site.css の旧 .brand>*{display:none!important} をこのページ群で確実に解除する。 */", "/* 共通ヘッダーのレスポンシブ補助 */")
          hub.write_text(text, encoding='utf-8')

          site = Path('assets/css/site.css')
          text = site.read_text(encoding='utf-8')
          text = re.sub(r"background\s*:\s*url\(['\"]?\.\./img/logo-airadmin8-robotics-pc\.png['\"]?\)[^;}]*(?:;|(?=\}))", 'background: none;', text, flags=re.I)
          text = re.sub(r"background-image\s*:\s*url\(['\"]?\.\./img/logo-airadmin8-robotics-pc\.png['\"]?\)\s*;?", 'background-image: none;', text, flags=re.I)
          text = re.sub(r'\.brand\s*>\s*\*\s*\{[^{}]*?display\s*:\s*none\s*!important\s*;?[^{}]*?\}', '', text, flags=re.I | re.S)
          site.write_text(text, encoding='utf-8')

          forbidden = [
              ('products/unitree-g1-d.html', 'main-logo.css'),
              ('assets/css/review-fixes-20260731.css', '.brand > * { display: none !important; }'),
              ('assets/css/content-hub.css', '.brand>*{display:none!important}'),
              ('assets/css/site.css', 'logo-airadmin8-robotics-pc.png'),
          ]
          for filename, marker in forbidden:
              if marker in Path(filename).read_text(encoding='utf-8'):
                  raise SystemExit(f'cleanup failed: {filename}: {marker}')

      - name: Commit cleaned sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/unitree-g1-d.html assets/css/review-fixes-20260731.css assets/css/content-hub.css assets/css/site.css
          git diff --cached --quiet && exit 0
          git commit -m 'cleanup: remove legacy logo CSS and stylesheet references'
          git push origin HEAD:release/physical-ai-site-v1.0.0
