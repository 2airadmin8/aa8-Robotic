name: Sync shared header and footer

on:
  push:
    branches: [main]
    paths:
      - includes/site-header.html
      - includes/site-footer.html
      - assets/css/shared-layout.css
      - .github/workflows/sync-shared-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-layout-main
  cancel-in-progress: false

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize shared layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          header_source = Path('includes/site-header.html').read_text(encoding='utf-8').strip()
          footer_source = Path('includes/site-footer.html').read_text(encoding='utf-8').strip()
          shared_css = '<link rel="stylesheet" href="/assets/css/shared-layout.css?v=20260803-1">'
          excluded_parts = {'.git', '.github', 'includes', 'backups', 'node_modules'}

          def is_public_html(path):
              if path.suffix.lower() != '.html':
                  return False
              if any(part in excluded_parts for part in path.parts) or '.bak' in path.name:
                  return False
              text = path.read_text(encoding='utf-8', errors='ignore')
              return '<body' in text.lower() and '</body>' in text.lower()

          def active_key(path):
              posix = path.as_posix()
              for key in ('products', 'use-cases', 'support', 'cases', 'resources'):
                  if posix == f'{key}.html' or posix.startswith(f'{key}/'):
                      return key
              return 'contact' if posix == 'contact.html' else None

          header_pattern = re.compile(r'(?:\s*<!--\s*共通ヘッダー[^>]*-->\s*)*<header\b[^>]*>.*?</header>', re.S | re.I)
          footer_pattern = re.compile(r'(?:\s*<!--\s*共通フッター[^>]*-->\s*)*<footer\b[^>]*>.*?</footer>', re.S | re.I)
          shared_css_pattern = re.compile(r'\s*<link\s+rel=["\']stylesheet["\']\s+href=["\']/assets/css/shared-layout\.css[^"\']*["\']\s*/?>', re.I)
          public_files = sorted(p for p in root.rglob('*.html') if is_public_html(p))
          changed = []

          for path in public_files:
              text = path.read_text(encoding='utf-8')
              header = header_source
              key = active_key(path)
              if key:
                  header = header.replace(f'data-nav-key="{key}"', f'data-nav-key="{key}" aria-current="page"', 1)

              new_text = shared_css_pattern.sub('', text)
              new_text = re.sub(r'</head>', shared_css + '\n</head>', new_text, count=1, flags=re.I)

              if header_pattern.search(new_text):
                  new_text = header_pattern.sub(lambda _m: '\n' + header, new_text, count=1)
              else:
                  new_text = re.sub(r'<body([^>]*)>', lambda m: m.group(0) + '\n' + header, new_text, count=1, flags=re.I)

              if footer_pattern.search(new_text):
                  new_text = footer_pattern.sub(lambda _m: '\n' + footer_source, new_text, count=1)
              else:
                  new_text = re.sub(r'</body>', lambda m: footer_source + '\n' + m.group(0), new_text, count=1, flags=re.I)

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Public pages: {len(public_files)}')
          print(f'Updated pages: {len(changed)}')
          for item in changed:
              print(item)
          PY

      - name: Validate synchronized pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          excluded_parts = {'.git', '.github', 'includes', 'backups', 'node_modules'}
          failures = []
          checked = 0

          for path in Path('.').rglob('*.html'):
              if any(part in excluded_parts for part in path.parts) or '.bak' in path.name:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if '<body' not in text.lower() or '</body>' not in text.lower():
                  continue
              checked += 1
              checks = {
                  'header': text.count('data-shared-layout="header"') == 1,
                  'footer': text.count('data-shared-layout="footer"') == 1,
                  'shared css': text.count('/assets/css/shared-layout.css') == 1,
                  'sp logo': '/assets/img/logo-airadmin8-robotics-sp.svg' in text,
                  'pc logo': '/assets/img/logo-airadmin8-robotics-pc.svg' in text,
              }
              for label, ok in checks.items():
                  if not ok:
                      failures.append(f'{path.as_posix()}: {label}')

          print(f'Validated pages: {checked}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          PY

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: synchronize shared header and footer"
          git pull --rebase origin main
          git push origin main
