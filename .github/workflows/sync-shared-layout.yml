name: Sync shared header and footer

on:
  push:
    branches: [main]
    paths:
      - includes/site-header.html
      - includes/site-footer.html
      - .github/workflows/sync-shared-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-layout-main
  cancel-in-progress: false

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize shared layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          header_source = Path('includes/site-header.html').read_text(encoding='utf-8').strip()
          footer_source = Path('includes/site-footer.html').read_text(encoding='utf-8').strip()

          excluded_parts = {'.git', '.github', 'includes', 'backups', 'node_modules'}

          def is_public_html(path: Path) -> bool:
              if path.suffix.lower() != '.html':
                  return False
              if any(part in excluded_parts for part in path.parts):
                  return False
              if '.bak' in path.name:
                  return False
              return True

          def active_key(path: Path):
              posix = path.as_posix()
              for key in ('products', 'use-cases', 'support', 'cases', 'resources'):
                  if posix == f'{key}.html' or posix.startswith(f'{key}/'):
                      return key
              return 'contact' if posix == 'contact.html' else None

          header_pattern = re.compile(r'<header\b[^>]*>.*?</header>', re.S | re.I)
          footer_pattern = re.compile(r'<footer\b[^>]*>.*?</footer>', re.S | re.I)

          changed = []
          for path in sorted(p for p in root.rglob('*.html') if is_public_html(p)):
              text = path.read_text(encoding='utf-8')
              header = header_source
              key = active_key(path)
              if key:
                  header = header.replace(
                      f'data-nav-key="{key}"',
                      f'data-nav-key="{key}" aria-current="page"',
                      1,
                  )

              if header_pattern.search(text):
                  new_text = header_pattern.sub(header, text, count=1)
              else:
                  new_text = re.sub(r'<body([^>]*)>', r'<body\1>\n' + header, text, count=1, flags=re.I)

              if footer_pattern.search(new_text):
                  new_text = footer_pattern.sub(footer_source, new_text, count=1)
              else:
                  new_text = re.sub(r'</body>', footer_source + '\n</body>', new_text, count=1, flags=re.I)

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Validate synchronized pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          excluded_parts = {'.git', '.github', 'includes', 'backups', 'node_modules'}
          failures = []
          for path in Path('.').rglob('*.html'):
              if any(part in excluded_parts for part in path.parts) or '.bak' in path.name:
                  continue
              text = path.read_text(encoding='utf-8')
              checks = {
                  'header': len(re.findall(r'data-shared-layout="header"', text)) == 1,
                  'footer': len(re.findall(r'data-shared-layout="footer"', text)) == 1,
                  'sp logo': '/assets/img/logo-airadmin8-robotics-sp.svg' in text,
                  'pc logo': '/assets/img/logo-airadmin8-robotics-pc.svg' in text,
              }
              for label, ok in checks.items():
                  if not ok:
                      failures.append(f'{path.as_posix()}: {label}')

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          PY

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: synchronize shared header and footer"
          git push origin HEAD:main
