<script data-aa8-menu-runtime="true">
(() => {
  if (window.__AA8_SHARED_MENU_READY__) return;
  window.__AA8_SHARED_MENU_READY__ = true;

  const closeMenu = () => {
    const header = document.querySelector('.site-header');
    const button = header?.querySelector('.menu');
    const navigation = header?.querySelector('.nav');
    navigation?.classList.remove('open');
    button?.setAttribute('aria-expanded', 'false');
  };

  document.addEventListener('click', (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;

    const button = target.closest('.site-header .menu');
    if (button instanceof HTMLButtonElement) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const navigation = button.closest('.site-header')?.querySelector('.nav');
      if (!(navigation instanceof HTMLElement)) return;
      const isOpen = navigation.classList.toggle('open');
      button.setAttribute('aria-expanded', String(isOpen));
      return;
    }

    if (target.closest('.site-header .nav a')) {
      closeMenu();
    }
  }, true);

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });
})();
</script>
